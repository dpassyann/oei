<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="1716" viewBox="0 0 1200 1716"
     role="img" aria-labelledby="title desc">
  <title id="title">Quatrième de couverture — Livre blanc OEI</title>
  <desc id="desc">Maquette vectorielle éditable avec emplacement photo et code-barres modifiable.</desc>

  <defs>
    <style>
      .sans { font-family: Inter, Montserrat, Arial, Helvetica, sans-serif; }
      .serif { font-family: "Playfair Display", Georgia, "Times New Roman", serif; }
      .gold { fill: #E8A530; }
      .white { fill: #F7F4EF; }
      .muted { fill: #8F9BB0; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2348"/>
      <stop offset="100%" stop-color="#071d3d"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="1000" cy="975" r="305"/>
    </clipPath>
    <clipPath id="photoClip">
      <rect x="110" y="1020" width="232" height="285"/>
    </clipPath>
    <filter id="grayscale">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="1716" fill="url(#bg)"/>

  <!-- Cadre décoratif -->
  <path d="M42 1700 H300 M42 1700 V62 Q42 40 64 40 H1125"
        fill="none" stroke="#E8A530" stroke-width="2"/>
  <circle cx="42" cy="1700" r="6" fill="#E8A530"/>
  <circle cx="1125" cy="40" r="6" fill="#E8A530"/>
  <path d="M1180 1480 V1660 Q1180 1700 1140 1700 H865"
        fill="none" stroke="#E8A530" stroke-width="2"/>

  <!-- Citation -->
  <line x1="110" y1="120" x2="110" y2="326" stroke="#E8A530" stroke-width="3"/>
  <text x="142" y="175" class="serif gold" font-size="92">“</text>
  <text x="165" y="245" class="serif white" font-size="51">
    <tspan x="165" dy="0">Le logiciel est devenu un bien</tspan>
    <tspan x="165" dy="64">d’intérêt public.</tspan>
  </text>
  <text x="515" y="310" class="serif gold" font-size="50">”</text>

  <!-- Texte de présentation -->
  <text x="110" y="415" class="sans white" font-size="22.5">
    <tspan x="110" dy="0">Chaque jour, des millions de personnes confient leur épargne, leur santé,</tspan>
    <tspan x="110" dy="31">leurs communications, leur mobilité et parfois même leur sécurité à des</tspan>
    <tspan x="110" dy="31">systèmes informatiques invisibles. Pourtant, alors que les technologies</tspan>
    <tspan x="110" dy="31">reposent sur des normes toujours plus exigeantes, l’exercice même de</tspan>
    <tspan x="110" dy="31">la profession informatique demeure largement dépourvu de cadre</tspan>
    <tspan x="110" dy="31">déontologique commun.</tspan>

    <tspan x="110" dy="60">Ce Livre Blanc propose une réflexion sur la place de l’informatique dans</tspan>
    <tspan x="110" dy="31">nos sociétés modernes et pose les fondations d’un mouvement visant à</tspan>
    <tspan x="110" dy="31">promouvoir la compétence, l’éthique et la responsabilité professionnelle</tspan>
    <tspan x="110" dy="31">dans la conception des systèmes numériques.</tspan>

    <tspan x="110" dy="60">Plus qu’une réforme, il s’agit d’une prise de conscience collective :</tspan>
    <tspan x="110" dy="31">à mesure que le logiciel devient une infrastructure essentielle, ceux</tspan>
    <tspan x="110" dy="31">qui le conçoivent doivent pouvoir assumer pleinement la responsabilité</tspan>
    <tspan x="110" dy="31">qui en découle.</tspan>
  </text>

  <!-- Signature éditoriale -->
  <text x="110" y="920" class="sans gold" font-size="23" font-weight="700" letter-spacing="7">
    COMPÉTENCE.  ÉTHIQUE.  RESPONSABILITÉ.
  </text>
  <line x1="110" y1="952" x2="165" y2="952" stroke="#E8A530" stroke-width="4"/>

  <!-- Globe en filigrane -->
  <g opacity="0.18" stroke="#F7F4EF" fill="none" stroke-width="1.4" clip-path="url(#globeClip)">
    <circle cx="1000" cy="975" r="305"/>
    <ellipse cx="1000" cy="975" rx="145" ry="305"/>
    <ellipse cx="1000" cy="975" rx="245" ry="305"/>
    <ellipse cx="1000" cy="975" rx="305" ry="105"/>
    <ellipse cx="1000" cy="975" rx="305" ry="205"/>
    <path d="M710 900 C850 820 1010 780 1280 770"/>
    <path d="M720 1040 C900 960 1090 930 1300 980"/>
    <path d="M760 1160 C920 1080 1110 1100 1300 1180"/>
    <circle cx="860" cy="835" r="6" fill="#E8A530" stroke="none"/>
    <circle cx="1085" cy="900" r="6" fill="#E8A530" stroke="none"/>
    <circle cx="1170" cy="1140" r="6" fill="#E8A530" stroke="none"/>
    <circle cx="900" cy="1230" r="6" fill="#E8A530" stroke="none"/>
  </g>

  <!-- Bloc auteur — photo en niveaux de gris, fond uni bleu nuit -->
  <rect x="110" y="1020" width="232" height="285" fill="#0A2348"/>
  <image
    href="/assets/livre-blanc/photo-auteur.png"
    x="110" y="1020" width="232" height="285"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#photoClip)"
    filter="url(#grayscale)"
  />
  <rect x="110" y="1020" width="232" height="285" fill="none" stroke="#E8A530" stroke-width="2"/>

  <line x1="370" y1="1020" x2="370" y2="1305" stroke="#E8A530" stroke-width="2"/>

  <text x="410" y="1055" class="sans white" font-size="31" letter-spacing="3">YANN DEUNGOUÉ</text>
  <text x="410" y="1095" class="sans gold" font-size="18" font-weight="700" letter-spacing="1.7">
    ARCHITECTE LOGICIEL &amp; RESPONSABLE TECHNIQUE
  </text>

  <text x="410" y="1140" class="sans white" font-size="19">
    <tspan x="410" dy="0">Fort de plus de 15 années d’expérience dans les secteurs</tspan>
    <tspan x="410" dy="28">de la finance, des systèmes critiques et des architectures</tspan>
    <tspan x="410" dy="28">d’entreprise, il œuvre pour élever les standards de la</tspan>
    <tspan x="410" dy="28">profession informatique.</tspan>

    <tspan x="410" dy="45">Fondateur de l’initiative Ordre International des Experts de</tspan>
    <tspan x="410" dy="28">l’Informatique (OEI),</tspan>
    <tspan x="410" dy="28">il porte ce projet avec l’ambition de structurer la profession</tspan>
    <tspan x="410" dy="28">informatique à la hauteur de sa responsabilité réelle dans les</tspan>
    <tspan x="410" dy="28">systèmes critiques qui structurent nos sociétés.</tspan>
  </text>

  <!-- Logo OEI simplifié -->
  <g transform="translate(154 1498)" fill="none" stroke="#E8A530" stroke-width="3">
    <path d="M0,-45 C-25,-27 -43,-24 -56,-22 V10 C-56,52 -33,78 0,98 C33,78 56,52 56,10 V-22 C43,-24 25,-27 0,-45 Z"/>
    <circle cx="0" cy="20" r="29"/>
    <ellipse cx="0" cy="20" rx="14" ry="29"/>
    <path d="M-29 20 H29 M-25 8 C-10 14 10 14 25 8 M-25 32 C-10 26 10 26 25 32"/>
  </g>
  <line x1="228" y1="1450" x2="228" y2="1564" stroke="#E8A530" stroke-width="2"/>
  <text x="250" y="1478" class="sans gold" font-size="15" letter-spacing="1.2">
    <tspan x="250" dy="0">ORDRE INTERNATIONAL DES</tspan>
    <tspan x="250" dy="22">EXPERTS DE L'INFORMATIQUE</tspan>
  </text>

  <!-- Zone ISBN / code-barres -->
  <text x="905" y="1418" class="sans white" font-size="17" letter-spacing="1.5">ISBN : 9782322661350</text>
