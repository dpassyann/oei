    <text x="1007" y="1563" text-anchor="middle" class="sans" fill="#111" font-size="20" letter-spacing="2">
      9 782322 661350
    </text>
  </g>

  <!-- Mention IA -->
  <g transform="translate(350 1635)">
    <path d="M0 0 C8 -18 25 -20 37 -9 C25 -8 13 0 7 14 C15 9 22 2 29 -7"
          fill="none" stroke="#E8A530" stroke-width="2"/>
  </g>
  <text x="400" y="1644" class="sans muted" font-size="19" font-style="italic">
    <tspan x="400" dy="0">Rédaction assistée par intelligence artificielle,</tspan>
    <tspan x="400" dy="26">relue, corrigée et validée par l’auteur.</tspan>
  </text>
</svg>
