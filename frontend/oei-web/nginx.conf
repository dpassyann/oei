# nginx.conf — served by the `runtime` stage of `frontend/oei-web/Dockerfile`.
# Consistent with the configuration already documented in
# .prompt/deployment/deploiement-aws.md §8.2 (infra/docker/nginx.conf), with basic
# security headers added since this file also doubles as local/staging Nginx config.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Basic security headers. HSTS is deliberately NOT set here: it belongs in front of
    # TLS termination (Caddy/CloudFront in production, see deploiement-aws.md §9/§11), not
    # in a container that itself only ever serves plain HTTP on 8080.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-lived cache for hashed, immutable build assets (Angular's production build
    # fingerprints every JS/CSS/font/image filename with a content hash).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # index.html itself must never be cached: it references the current hashed bundle
    # names, and a stale cached copy would keep serving an old deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any route unknown to Nginx falls back to index.html so Angular's
    # client-side router can take over (e.g. /reseau-neuronal, /espace-membre/cv).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
