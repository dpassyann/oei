    post:
      tags: [member-cv]
      operationId: validateCvSectionTranslation
      summary: Validation humaine d'une traduction avant qu'elle ne soit exploitable dans un rendu PDF.
      security: [{ bearerAuth: [member] }]
      parameters:
        - $ref: "#/components/parameters/CvId"
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
        - name: language
          in: path
          required: true
          schema:
            type: string
      responses:
