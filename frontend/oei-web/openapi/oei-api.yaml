  # ---------------------------------------------------------------------------
  # /api/admin/v1 — global audit
  # ---------------------------------------------------------------------------
  /api/admin/v1/audit-log:
    get:
      tags: [admin-audit]
      operationId: listAdminAuditLog
      summary: Journal d'audit global de la plateforme.
      security: [{ bearerAuth: [admin] }]
      responses:
        "200":
          description: Entrées d'audit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstitutionAuditLog"

  # ---------------------------------------------------------------------------
  # Events & community feed (`.prompt/plan/final/03-EVENTS-FEED-MODERATION-V2.md` and
  # `04-EVENTS-COMMUNITY-FEED.md`) — appended at the end of `paths` so as not to reorder any
  # pre-existing entry. `member-events`' `feed`/`posts`/`comments`-by-post endpoints are a
  # minimal, documented extension of the task's literal 9-endpoint list, needed to actually
  # list/create feed entries; the literal endpoints themselves are still present verbatim.
  # ---------------------------------------------------------------------------
  /api/public/v1/events:
    get:
      tags: [public-events]
      operationId: listPublicEvents
      summary: Agenda public des événements (à la une, ouverts, historique).
      responses:
        "200":
          description: Événements publiés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /api/public/v1/events/{slug}:
    get:
      tags: [public-events]
      operationId: getPublicEventBySlug
      summary: Détail d'un événement publié.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Événement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/member/v1/events/proposals:
    post:
      tags: [member-events]
      operationId: submitEventProposal
      summary: >
        Soumet une proposition d'événement (workflow DRAFT→SUBMITTED→AI_PRECHECK→
        MODERATOR_REVIEW→APPROVED→PUBLISHED ; le précheck IA n'est jamais bloquant ni
        auto-publiant en V1).
      security: [{ bearerAuth: [member] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventProposalDraft"
      responses:
        "201":
          description: Proposition créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventProposal"
    get:
      tags: [member-events]
      operationId: listMyEventProposals
      summary: Propositions d'événement du membre connecté ("mes propositions").
      security: [{ bearerAuth: [member] }]
      responses:
        "200":
          description: Propositions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventProposal"

  /api/member/v1/events/{id}/registrations:
    post:
      tags: [member-events]
      operationId: registerToEvent
      summary: Inscription (`GOING`) du membre connecté à un événement.
      security: [{ bearerAuth: [member] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Inscription créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRegistration"

  /api/member/v1/events/{id}/registrations/me:
    get:
      tags: [member-events]
      operationId: getMyEventRegistration
      summary: Inscription du membre connecté à cet événement, si elle existe.
      security: [{ bearerAuth: [member] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inscription trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRegistration"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [member-events]
      operationId: unregisterFromEvent
      summary: Désinscription (`GOING` -> supprimée) du membre connecté de cet événement.
      security: [{ bearerAuth: [member] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Désinscription effectuée

  /api/member/v1/events/{id}/feed:
    get:
      tags: [member-events]
      operationId: listEventFeedPosts
      summary: Fil live d'un événement (posts), en lecture seule hors fenêtre de l'événement.
      security: [{ bearerAuth: [member] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Publications du fil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventPost"

  /api/member/v1/events/{id}/posts:
    post:
      tags: [member-events]
      operationId: createEventPost
      summary: >
        Publie un post court (texte + photo optionnelle) sur le fil live — une photo ne peut
        être jointe qu'après consentement explicite (voir `/photo-consent`).
      security: [{ bearerAuth: [member] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPostDraft"
      responses:
        "201":
          description: Publication créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPost"

  /api/member/v1/events/{id}/comments:
    post:
      tags: [member-events]
      operationId: addEventComment
      summary: >
        Commente un post du fil live — réservé aux membres ayant participé (`GOING`),
        uniquement dans la fenêtre `commentsOpenAt`/`commentsClosedAt`.
      security: [{ bearerAuth: [member] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCommentDraft"
      responses:
        "201":
          description: Commentaire créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventComment"

  /api/member/v1/events/{id}/like:
    post:
      tags: [member-events]
      operationId: likeEventPost
      summary: Like simple et idempotent (un par membre) d'un post du fil live.
      security: [{ bearerAuth: [member] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postId]
              properties:
                postId:
                  type: string
      responses:
        "200":
          description: Post mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPost"

  /api/member/v1/events/{id}/photo-consent:
    post:
      tags: [member-events]
      operationId: giveEventPhotoConsent
      summary: >
        Consentement explicite du membre à la publication de ses photos sur le fil de cet
        événement — distinct de l'inscription (`/registrations`), qui ne vaut jamais consentement
        à la publication d'image.
      security: [{ bearerAuth: [member] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Consentement enregistré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPhotoConsent"

  /api/admin/v1/events/moderation:
    get:
      tags: [admin-events]
      operationId: listEventModerationQueue
      summary: File d'attente des propositions d'événement en `MODERATOR_REVIEW`.
      security: [{ bearerAuth: [admin] }]
      responses:
        "200":
          description: Propositions en attente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventProposal"

  /api/admin/v1/events/{id}/approve:
    post:
      tags: [admin-events]
      operationId: approveEventProposal
      summary: Approuve une proposition d'événement (elle devient publiable).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Proposition approuvée
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/v1/comments/{id}/hide:
    post:
      tags: [admin-events]
      operationId: hideEventComment
      summary: Masque un commentaire du fil live (modération, `HIDDEN`).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Commentaire masqué
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Jeton OIDC émis par Keycloak (realm `oei`). Les rôles requis par préfixe de
        chemin sont documentés dans `docs/architecture/keycloak-roles.md`.

  parameters:
    CvId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ContentId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflit (ex. compte déjà existant)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Erreur de validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # -------------------------------------------------------------------------
    # Common
    # -------------------------------------------------------------------------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    PageMetadata:
      type: object
      required: [page, pageSize, totalItems]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer

    ContentDocument:
      type: object
      required: [slug, lang, title, body, isFallback]
      properties:
        slug:
          type: string
        lang:
          type: string
        title:
          type: string
        body:
          type: string
        isFallback:
          type: boolean

    # -------------------------------------------------------------------------
    # Home sections (see the `home-legacy` tag)
    # -------------------------------------------------------------------------
    Stat:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: integer

    DomainArea:
      type: object
      required: [icon, title, description]
      properties:
        icon:
          type: string
        title:
          type: string
        description:
          type: string

    NewsItem:
      type: object
      required: [title, excerpt, imageUrl, path]
      properties:
        title:
          type: string
        excerpt:
          type: string
        imageUrl:
          type: string
        path:
          type: string
        category:
          type: string
          description: >
            Champ bonus non encore modélisé côté Angular (`NewsItem`) — voir
            `mock/src/data/news.ts`.
          enum:
            [article, communique, livre-blanc, rapport, evenement, consultation, appel-a-contribution]
        publishedAt:
          type: string
          format: date
          description: Champ bonus non encore modélisé côté Angular (`NewsItem`).

    SearchResult:
      type: object
      required: [type, title, excerpt, path]
      properties:
        type:
          type: string
          enum: [resource, news]
        title:
          type: string
        excerpt:
          type: string
        path:
          type: string
          description: Route interne (jamais une URL externe) vers l'élément trouvé.
        fragment:
          type: string
          description: Ancre facultative sur `path` (ex. la section Livre Blanc sur `/ressources`).

    Partner:
      type: object
      required: [id, name, logoUrl, description, websiteUrl, category]
      properties:
        id:
          type: string
        name:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        websiteUrl:
          type: string
        category:
          type: string

    # -------------------------------------------------------------------------
    # Identity / Membership / Profile
    # -------------------------------------------------------------------------
    AccountRegistration:
      type: object
      required: [email, locale, country, consentAccepted]
      properties:
        email:
          type: string
          format: email
        locale:
          type: string
        country:
          type: string
        consentAccepted:
          type: boolean
        oidcSubject:
          type: string
          description: Identifiant OIDC si inscription via fournisseur externe (Keycloak).

    MembershipTier:
      type: string
      enum: [STANDARD, SILVER, GOLD, FOUNDING, HONORARY, INSTITUTIONAL_AFFILIATE]

    MembershipStatus:
      type: string
      description: >
        Statut d'activité du membre (indépendant de `MembershipTier`, qui reste la catégorie
        permanente d'adhésion — voir `frontend/oei-web/src/app/domain/model/membership/membership.ts`
        pour la décision de modélisation). `HONORARY`/`FOUNDING` désignent ici le membre
        honoraire/fondateur exempté à vie de cotisation (droits complets inconditionnels) —
        distinct du `tier` du même nom, qui reste l'identité permanente du membre même
        lorsque son `status` est encore `PENDING`/`ACTIVE` (ex. nomination en cours de
        validation). `GRACE_PERIOD` conserve tous les droits (voir `MembershipEntitlementService`)
        avec un avertissement UI de renouvellement imminent. `EXPIRED` restreint aux droits de
        base (profil, CV, lecture publique). `TERMINATED` : fin définitive de l'adhésion.
      enum: [PENDING, ACTIVE, GRACE_PERIOD, EXPIRED, SUSPENDED, HONORARY, FOUNDING, TERMINATED]

    Membership:
      type: object
      required: [memberId, tier, status]
      properties:
        memberId:
          type: string
        tier:
          $ref: "#/components/schemas/MembershipTier"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        startedAt:
          type: string
          format: date-time
        renewedAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true

    MembershipEntitlement:
      type: string
      description: >
        Droits calculés par `MembershipEntitlementService` (frontend) à partir du
        `MembershipStatus` — voir doc `01-MEMBERS-DYNAMIC-SPACE.md` §Entitlements.
      enum:
        [
          PROFILE_EDIT,
          PROFILE_PUBLIC,
          CV_EDIT,
          CV_EXPORT_PDF,
          BUSINESS_CARD_EXPORT,
          BUSINESS_CARD_ORDER,
          ARTICLE_SUBMIT,
          EVENT_POST,
          MEMBER_DIRECTORY,
          WALLET_PASS,
          CERTIFICATION_BADGE,
        ]

    MembershipFeeTier:
      type: string
      description: >
        Grille tarifaire déjà publiée sur `/membres-fondateurs` (20€ / 50€ / 100€ / 250€
        par an) — voir `domain/model/membership-fee/membership-fee-tier.ts`.
      enum: [STUDENT, MEMBER, FOUNDING, SUPPORTER]

    MembershipFeePaymentStatus:
      type: string
      enum: [PAID, FAILED]

    MembershipFeePayment:
      type: object
      required: [id, memberId, cycleYear, tier, amount, status, paidAt]
      properties:
        id:
          type: string
        memberId:
          type: string
        cycleYear:
          type: integer
          description: Année de démarrage du cycle réglé (22 avril de cette année).
        tier:
          $ref: "#/components/schemas/MembershipFeeTier"
        amount:
          type: number
          format: double
          description: Montant réellement réglé (prorata si paiement en cours de cycle).
        status:
          $ref: "#/components/schemas/MembershipFeePaymentStatus"
        paidAt:
          type: string
          format: date-time

    MembershipFeeAccount:
      type: object
      required: [memberId, tier, payments]
      properties:
        memberId:
          type: string
        tier:
          $ref: "#/components/schemas/MembershipFeeTier"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/MembershipFeePayment"

    MembershipFeePaymentRequest:
      type: object
      required: [tier, cycleYear, amount]
      properties:
        tier:
          $ref: "#/components/schemas/MembershipFeeTier"
        cycleYear:
          type: integer
        amount:
          type: number
          format: double
          description: >
            Montant prorata calculé côté client (voir `calculateProratedFee`) — non
            recalculé côté serveur dans ce contrat mocké.

    Member:
      type: object
      required: [id, publicSlug, displayName, locale, country]
      properties:
        id:
          type: string
        publicSlug:
          type: string
        displayName:
          type: string
        legalName:
          type: string
          description: Identité légale, distincte du nom public, jamais exposée sans base légale.
        locale:
          type: string
        country:
          type: string
        createdAt:
          type: string
          format: date-time
        membership:
          $ref: "#/components/schemas/Membership"

    LanguageProficiency:
      type: object
      required: [language, level]
      properties:
        language:
          type: string
        level:
          type: string
          enum: [A1, A2, B1, B2, C1, C2, NATIVE]

    Experience:
      type: object
      required: [id, organization, title, startDate]
      properties:
        id:
          type: string
        organization:
          type: string
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        current:
          type: boolean
        description:
          type: string
        isDemoData:
          type: boolean
          default: false

    Education:
      type: object
      required: [id, institution, program, startDate]
      properties:
        id:
          type: string
        institution:
          type: string
        program:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        description:
          type: string

    Skill:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        verified:
          type: boolean
          default: false

    ProfessionalProfile:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
        title:
          type: string
        summary:
          type: string
        location:
          type: string
        availability:
          type: string
          enum: [AVAILABLE, OPEN_TO_OPPORTUNITIES, NOT_AVAILABLE]
        expertiseAreas:
          type: array
          items:
            type: string
        technologies:
          type: array
          items:
            type: string
        sectors:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageProficiency"
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
        educations:
          type: array
          items:
            $ref: "#/components/schemas/Education"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        completenessScore:
          type: integer
          minimum: 0
          maximum: 100

    RecognizedCertification:
      type: object
      required: [id, name, issuingOrganization]
      properties:
        id:
          type: string
        name:
          type: string
        issuingOrganization:
          type: string
        catalogReference:
          type: string
        autoValidate:
          type: boolean
          default: false

    CertificationStatus:
      type: string
      enum: [DECLARED, UNDER_REVIEW, VALIDATED, REJECTED, EXPIRED, REVOKED]

    CertificationDeclaration:
      type: object
      required: [name, issuingOrganization]
      properties:
        name:
          type: string
        issuingOrganization:
          type: string
        recognizedCertificationId:
          type: string
          nullable: true
        issuedAt:
          type: string
          format: date
        expiresAt:
          type: string
          format: date
          nullable: true
        proofDocumentUrl:
          type: string
          format: uri

    Certification:
      allOf:
        - $ref: "#/components/schemas/CertificationDeclaration"
        - type: object
          required: [id, memberId, status]
          properties:
            id:
              type: string
            memberId:
              type: string
            status:
              $ref: "#/components/schemas/CertificationStatus"
            validatedBy:
              type: string
              nullable: true
            validatedAt:
              type: string
              format: date-time
              nullable: true

    Badge:
      type: object
      required: [id, code, name, category]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
        iconUrl:
          type: string
          format: uri
        category:
          type: string
          enum: [MEMBERSHIP, CONTRIBUTION, CERTIFICATION, RECOGNITION]

    BadgeAward:
      type: object
      required: [id, badgeId, memberId, awardedAt, source]
      properties:
        id:
          type: string
        badgeId:
          type: string
        memberId:
          type: string
        awardedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [AUTOMATIC, MANUAL, INSTITUTION_PROPOSAL]
        awardedBy:
          type: string
          nullable: true
        revoked:
          type: boolean
          default: false
        revokedAt:
          type: string
          format: date-time
          nullable: true

    EthicalCharterSignature:
      type: object
      required: [id, memberId, version, signedAt]
      properties:
        id:
          type: string
        memberId:
          type: string
        version:
          type: string
        signedAt:
          type: string
          format: date-time

    CvTemplate:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        previewUrl:
          type: string
          format: uri

    CvTranslationStatus:
      type: string
      enum: [MACHINE_GENERATED, PENDING_VALIDATION, VALIDATED]

    CvTranslation:
      type: object
      required: [language, status]
      properties:
        id:
          type: string
        sectionId:
          type: string
        language:
          type: string
        content:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/CvTranslationStatus"
        translatedAt:
          type: string
          format: date-time
        validatedBy:
          type: string
          nullable: true

    CvSectionType:
      type: string
      enum:
        - IDENTITY
        - SUMMARY
        - EXPERIENCE
        - PROJECT
        - EDUCATION
        - CERTIFICATION
        - SKILL
        - LANGUAGE
        - PUBLICATION
        - CONFERENCE
        - ENGAGEMENT
        - DISTINCTION
        - REFERENCE

    CvSection:
      type: object
      required: [type, order, content]
      properties:
        id:
          type: string
        cvId:
          type: string
        type:
          $ref: "#/components/schemas/CvSectionType"
        order:
          type: integer
        content:
          type: object
          additionalProperties: true
        translations:
          type: array
          items:
            $ref: "#/components/schemas/CvTranslation"

    CvCreation:
      type: object
      required: [templateId, sourceLanguage]
      properties:
        templateId:
          type: string
        sourceLanguage:
          type: string

    Cv:
      allOf:
        - $ref: "#/components/schemas/CvCreation"
        - type: object
          required: [id, memberId, status]
          properties:
            id:
              type: string
            memberId:
              type: string
            status:
              type: string
              enum: [DRAFT, READY]
            sections:
              type: array
              items:
                $ref: "#/components/schemas/CvSection"

    CvRenderRequest:
      type: object
      required: [language]
      properties:
        language:
          type: string
        includeBadges:
          type: array
          items:
            type: string
          description: Identifiants de badges sélectionnés pour apparaître dans le rendu.

    PublicProfile:
      type: object
      required: [memberId, publicSlug]
      properties:
        memberId:
