    post:
      tags: [institution-recognition]
      operationId: createInstitutionBadgeProposal
      summary: >
        Propose une reconnaissance à un membre affilié (formation, contribution, mentorat,
        publication, distinction interne) — soumise à acceptation du membre ; l'OEI reste
        seul décideur pour un badge OEI officiel.
      security: [{ bearerAuth: [institution] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionBadgeProposalCreation"
      responses:
        "201":
          description: Proposition créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionBadgeProposal"

  # ---------------------------------------------------------------------------
  # /api/institution/v1 — audit
  # ---------------------------------------------------------------------------
  /api/institution/v1/audit-log:
    get:
      tags: [institution-audit]
      operationId: listInstitutionAuditLog
      summary: Journal d'audit des actions institutionnelles (invitations, affiliations, publications...).
      security: [{ bearerAuth: [institution] }]
      responses:
        "200":
          description: Entrées d'audit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstitutionAuditLog"

  # ---------------------------------------------------------------------------
  # /api/admin/v1 — content (CMS / gouvernance)
  # ---------------------------------------------------------------------------
  /api/admin/v1/content:
    get:
      tags: [admin-content]
      operationId: listAdminContent
      summary: >
        Liste le contenu CMS/gouvernance (filtres type, statut, langue, tag, et recherche texte
        libre `q` sur titre/corps — voir ADR 0002: étendu plutôt que remplacé).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ContentType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentWorkflowStatus"
        - name: lang
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Recherche texte libre sur le titre et le corps de la version courante.
          schema:
            type: string
      responses:
        "200":
          description: Contenus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"
    post:
      tags: [admin-content]
      operationId: createAdminContent
      summary: Crée un contenu (brouillon initial).
      security: [{ bearerAuth: [admin] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentCreation"
      responses:
        "201":
          description: Contenu créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"

  /api/admin/v1/content/{id}:
    get:
      tags: [admin-content]
      operationId: getAdminContent
      summary: Détail d'un contenu avec ses versions.
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Contenu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin-content]
      operationId: updateAdminContent
      summary: >
        Crée une nouvelle version d'un contenu (jamais d'écrasement d'une version publiée
        d'un document normatif — voir contrainte d'acceptation du CMS).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentVersionCreation"
      responses:
        "200":
          description: Nouvelle version créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVersion"

  /api/admin/v1/content/{id}/versions:
    get:
      tags: [admin-content]
      operationId: listAdminContentVersions
      summary: Historique complet des versions (y compris non publiées) pour rollback/audit.
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVersionPage"

  /api/admin/v1/content/{id}/submit:
    post:
      tags: [admin-content]
      operationId: submitAdminContent
      summary: Soumet la version courante en revue (DRAFT -> IN_REVIEW).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Contenu soumis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"

  /api/admin/v1/content/{id}/approve:
    post:
      tags: [admin-content]
      operationId: approveAdminContent
      summary: Enregistre une approbation (légale ou de gouvernance) sur la version courante.
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentApprovalCreation"
      responses:
        "200":
          description: Approbation enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentApproval"

  /api/admin/v1/content/{id}/reject:
    post:
      tags: [admin-content]
      operationId: rejectAdminContent
      summary: Rejette la version courante (retour en DRAFT avec commentaire).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
      responses:
        "200":
          description: Contenu rejeté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"

  /api/admin/v1/content/{id}/translations/request:
    post:
      tags: [admin-content]
      operationId: requestAdminContentTranslation
      summary: >
        Marque le contenu comme en attente de traduction avant programmation/publication
        (APPROVED -> TRANSLATION_PENDING). Ajouté (ADR 0002: étendre plutôt que remplacer) car le
        workflow du plan 04 distingue explicitement cette étape de `createAdminContentTranslation`
        (qui, elle, enregistre une traduction concrète pour une langue donnée).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Contenu en attente de traduction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"

  /api/admin/v1/content/{id}/schedule:
    post:
      tags: [admin-content]
      operationId: scheduleAdminContent
      summary: Programme la publication (APPROVED/TRANSLATION_PENDING -> SCHEDULED).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Contenu programmé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"

  /api/admin/v1/content/{id}/publish:
    post:
      tags: [admin-content]
      operationId: publishAdminContent
      summary: Publie la version approuvée (APPROVED/SCHEDULED -> PUBLISHED).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Contenu publié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPublication"

  /api/admin/v1/content/{id}/archive:
    post:
      tags: [admin-content]
      operationId: archiveAdminContent
      summary: Archive une version publiée (jamais de suppression physique).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Contenu archivé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"

  /api/admin/v1/content/{id}/translations:
    post:
      tags: [admin-content]
      operationId: createAdminContentTranslation
      summary: Ajoute/soumet une traduction pour une version de contenu.
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentTranslation"
      responses:
        "201":
          description: Traduction créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTranslation"

  /api/admin/v1/content/{id}/translations/{language}/validate:
    post:
      tags: [admin-content]
      operationId: validateAdminContentTranslation
      summary: Validation humaine d'une traduction (une traduction devient obsolète si la source change).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - name: language
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Traduction validée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTranslation"

  /api/admin/v1/content/{id}/contributions:
    get:
      tags: [admin-content]
      operationId: listAdminContentContributions
      summary: Contributions membres proposées sur ce contenu (avec diff).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentContribution"

  # ---------------------------------------------------------------------------
