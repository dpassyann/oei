      responses:
        "200":
          description: Section mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvSection"

  /api/member/v1/cv/{id}/sections/{sectionId}/translations:
    post:
      tags: [member-cv]
      operationId: requestCvSectionTranslation
      summary: Déclenche/soumet une traduction pour une section (automatique ou manuelle, non publiée tant que non validée).
      security: [{ bearerAuth: [member] }]
      parameters:
        - $ref: "#/components/parameters/CvId"
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvTranslation"
      responses:
        "201":
