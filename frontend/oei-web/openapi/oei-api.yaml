                $ref: "#/components/schemas/InstitutionOpportunity"

  /api/institution/v1/opportunities/{id}:
    put:
      tags: [institution-opportunities]
      operationId: updateInstitutionOpportunity
      summary: Met à jour une opportunité.
      security: [{ bearerAuth: [institution] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionOpportunityCreation"
      responses:
        "200":
          description: Opportunité mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionOpportunity"

  /api/institution/v1/opportunities/{id}/close:
    post:
      tags: [institution-opportunities]
      operationId: closeInstitutionOpportunity
