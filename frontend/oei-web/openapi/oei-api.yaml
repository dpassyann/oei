openapi: 3.0.3
info:
  title: OEI Platform API
  version: "2.0.0"
  description: >
    Contrat API transverse de la plateforme OEI (Ordre des Experts Informaticiens).

    Ce document est le contrat de fondation (voir ADR 0002) pour les trois chantiers
    fonctionnels : espace membre individuel, espace membre institutionnel et
    CMS/gouvernance documentaire. Il ne décrit QUE la forme des échanges (schémas,
    chemins, codes de statut) ; il n'implique aucune implémentation serveur réelle à ce
    stade — les adapters `*-mock.adapter.ts` simulent ces réponses en attendant le
    backend Spring Boot.

    Conventions de versionnement des chemins :
    - `/api/public/v1/**` : accessible sans authentification, données publiques.
    - `/api/member/v1/**` : requiert un JWT Keycloak avec au moins le rôle realm `member`.
    - `/api/institution/v1/**` : requiert un JWT Keycloak avec un rôle `institution-*`
      pour l'institution résolue depuis le token (isolation multi-tenant — voir
      `docs/architecture/keycloak-roles.md`).
    - `/api/admin/v1/**` : requiert le rôle realm `admin`.

    L'endpoint historique `GET /content/{lang}/{slug}` (hors préfixe versionné) est
    conservé tel quel pour ne pas casser l'intégration frontend existante
    (`content-api.adapter.ts`) ; les nouveaux endpoints de contenu public vivent sous
    `/api/public/v1/content` et `/api/public/v1/documents`.
tags:
  - name: content-legacy
    description: Endpoint historique de rendu de page, conservé pour compatibilité.
  - name: home-legacy
    description: >
      Endpoints historiques (hors préfixe `/api/public/v1`) consommés directement par
      `stats-api.adapter.ts`, `domains-api.adapter.ts`, `news-api.adapter.ts`,
      `partner-api.adapter.ts` et `lead-capture-api.adapter.ts`. Conservés tels quels pour
      ne pas casser cette intégration frontend existante, au même titre que
      `GET /content/{lang}/{slug}` (voir `content-legacy`). Le backend Spring Boot réel
      pourra à terme les exposer aussi sous `/api/public/v1/**` (ex. un futur flux
      RSS/Atom `/api/public/v1/news/feed.rss` pour les actualités), mais cela reste hors
      périmètre de ce contrat pour l'instant.
  - name: public-accounts
    description: Inscription et endpoints publics d'amorçage de compte.
  - name: public-content
    description: Contenu CMS et documents normatifs publics (lecture seule).
  - name: search
    description: >
      Recherche globale publique V1 (ressources et actualités uniquement — événements,
      membres, institutions et graphe hors périmètre, voir plan
      "actualités dynamiques, recherche globale et ressources").
  - name: public-institutions
    description: Pages publiques institutionnelles.
  - name: public-members
    description: Profils publics, cartes numériques et vérification de badges/pass.
  - name: member-profile
    description: Profil professionnel du membre connecté.
  - name: member-membership-fee
    description: >
      Cotisation annuelle du membre connecté (cycle 22 avril → 21 avril, calcul au
      prorata, paiement mocké — voir plan "adhésion & cotisation").
  - name: member-cv
    description: CV Builder (sections, traductions, rendu PDF).
  - name: member-certifications
    description: Déclaration et suivi des certifications.
  - name: member-badges
    description: Badges obtenus par le membre connecté.
  - name: member-public-profile
    description: Publication du profil public et de la carte numérique.
  - name: member-wallet
    description: Apple Wallet / Google Wallet (mocké en V1).
  - name: member-verification
    description: Demandes de vérification d'identité/profil/certification.
  - name: member-affiliation
    description: Rattachement du membre à une institution employeuse.
  - name: member-contributions
    description: Contributions du membre au contenu normatif (patchs, commentaires).
  - name: institution-account
    description: Compte institution, domaines email et partenariat.
  - name: institution-roles
    description: Rôles et affectations internes à l'institution.
  - name: institution-invitations
    description: Invitations d'employés à rejoindre l'espace institutionnel.
  - name: institution-affiliations
    description: Validation des demandes d'affiliation de membres.
  - name: institution-dashboard
    description: KPI et tableau de bord institutionnel.
  - name: institution-publications
    description: Publications institutionnelles et workflow de modération.
  - name: institution-opportunities
    description: Opportunités (emploi, stage, mentorat, mission, groupe de travail).
  - name: institution-recognition
    description: Propositions de reconnaissance (badge, formation) faites à un membre.
  - name: institution-audit
    description: Journal d'audit institutionnel.
  - name: admin-content
    description: Gestion et workflow du contenu CMS/gouvernance.
  - name: admin-media
    description: Médiathèque et scan antivirus.
  - name: admin-books
    description: Compilation de livres et génération PDF.
  - name: admin-git
    description: Synchronisation en lecture avec le dépôt Git normatif.
  - name: admin-institutions
    description: Supervision des institutions par l'OEI.
  - name: admin-members
    description: Supervision des membres, certifications et vérifications par l'OEI.
  - name: admin-audit
    description: Journal d'audit global.
  - name: public-events
    description: Agenda public des événements OEI (liste, détail par slug).
  - name: member-events
    description: >
      Proposition d'événement par un membre (workflow DRAFT→...→PUBLISHED avec précheck IA
      simulé), inscription, fil live pendant l'événement (posts/commentaires/likes) et
      consentement photo — voir `.prompt/plan/final/03-EVENTS-FEED-MODERATION-V2.md` et
      `04-EVENTS-COMMUNITY-FEED.md`.
  - name: admin-events
    description: Modération des propositions d'événement et des commentaires du fil live.
security: []
paths:
  # ---------------------------------------------------------------------------
  # Legacy (unchanged)
  # ---------------------------------------------------------------------------
  /content/{lang}/{slug}:
    get:
      tags: [content-legacy]
      operationId: getContent
      summary: Rendu d'une page de contenu (endpoint historique, ne pas modifier la forme).
      parameters:
        - name: lang
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDocument"

  # ---------------------------------------------------------------------------
  # Home sections (legacy, unversioned — see the `home-legacy` tag description)
  # ---------------------------------------------------------------------------
  /api/v1/stats/{lang}:
    get:
      tags: [home-legacy]
      operationId: getHomeStats
      summary: Statistiques affichées sur la page d'accueil (toutes à 0 tant qu'aucune donnée réelle n'existe).
      parameters:
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des statistiques
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stat"

  /api/v1/domains/{lang}:
    get:
      tags: [home-legacy]
      operationId: getDomainAreas
      summary: Les 8 domaines d'action de l'OEI.
      parameters:
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des domaines d'action
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainArea"

  /api/v1/news/{lang}:
    get:
      tags: [home-legacy]
      operationId: getLatestNews
      summary: >
        Dernières actualités. Le backend réel devra à terme aussi exposer ces actualités
        sous forme de flux RSS/Atom (ex. `/api/public/v1/news/feed.rss`) pour la
        syndication externe — hors périmètre de ce contrat pour l'instant.
      parameters:
        - name: lang
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Liste des actualités
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"

  /api/v1/partners/{lang}:
    get:
      tags: [home-legacy]
      operationId: getPartners
      summary: Partenaires (données de démonstration tant qu'aucun partenariat réel n'est confirmé).
      parameters:
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des partenaires
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"

  /api/v1/partners/{lang}/{id}:
    get:
      tags: [home-legacy]
      operationId: getPartner
      summary: Détail d'un partenaire par id.
      parameters:
        - name: lang
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Partenaire trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/leads:
    post:
      tags: [home-legacy]
      operationId: submitLead
      summary: Capture d'email pour l'envoi du Livre Blanc (simulée par le mock, journalisée en mémoire).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "204":
          description: Lead capturé
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/contact:
    post:
      tags: [home-legacy]
      operationId: submitContactMessage
      summary: >
        Message envoyé depuis le formulaire de contact public (simulé par le mock,
        journalisé en mémoire — aucun email réel n'est envoyé avant l'arrivée du backend
        Spring Boot).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name:
                  type: string
                  minLength: 1
                email:
                  type: string
                  format: email
                subject:
                  type: string
                message:
                  type: string
                  minLength: 1
      responses:
        "204":
          description: Message reçu
        "400":
          $ref: "#/components/responses/ValidationError"

  # ---------------------------------------------------------------------------
  # /api/public/v1 — accounts
  # ---------------------------------------------------------------------------
  /api/public/v1/accounts:
    post:
      tags: [public-accounts]
      operationId: registerAccount
      summary: Crée un compte membre (email vérifié ou OIDC) et démarre l'onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRegistration"
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

  # ---------------------------------------------------------------------------
  # /api/public/v1 — content & governance documents (read-only)
  # ---------------------------------------------------------------------------
  /api/public/v1/content/{slug}:
    get:
      tags: [public-content]
      operationId: getPublicContent
      summary: Récupère la version publiée d'un contenu CMS par slug (langue négociée via Accept-Language).
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Contenu publié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/public/v1/documents/{slug}/versions:
    get:
      tags: [public-content]
      operationId: listPublicDocumentVersions
      summary: Historique versionné public d'un document normatif (statuts, règlement, chartes...).
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des versions publiées
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVersionPage"

  # ---------------------------------------------------------------------------
  # /api/public/v1 — global search (V1 scope: resources + news only)
  # ---------------------------------------------------------------------------
  /api/public/v1/search:
    get:
      tags: [search]
      operationId: searchPublicContent
      summary: >
        Recherche globale V1, limitée aux ressources (`/ressources`) et aux actualités
        (`GET /api/v1/news/{lang}` — voir `home-legacy`). Événements, membres,
        institutions et graphe sont hors périmètre. Résultats à grouper par `type`
        côté client (voir `SearchResult`).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: types
          in: query
          required: false
          description: Liste de types séparés par virgule, ex. `RESOURCE,NEWS` (seules valeurs supportées en V1).
          schema:
            type: string
            example: "RESOURCE,NEWS"
        - name: locale
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Résultats de recherche groupables par type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"

  /api/public/v1/badges/catalog:
    get:
      tags: [public-members]
      operationId: listBadgeCatalog
      summary: Catalogue public des badges OEI (définitions, pas les attributions).
      responses:
        "200":
          description: Catalogue de badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  # ---------------------------------------------------------------------------
  # /api/public/v1 — institutions (public pages)
  # ---------------------------------------------------------------------------
  /api/public/v1/institutions/{slug}:
    get:
      tags: [public-institutions]
      operationId: getPublicInstitution
      summary: Page publique d'une institution.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Institution publique
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionPublicPage"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/public/v1/institutions/{slug}/publications:
    get:
      tags: [public-institutions]
      operationId: listPublicInstitutionPublications
      summary: Publications institutionnelles publiées et modérées.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Publications publiées
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionPublicationPage"

  /api/public/v1/institutions/{slug}/opportunities:
    get:
      tags: [public-institutions]
      operationId: listPublicInstitutionOpportunities
      summary: Opportunités publiées par l'institution (emploi, stage, mentorat...).
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Opportunités publiées
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionOpportunityPage"

  # ---------------------------------------------------------------------------
  # /api/public/v1 — members (public profile, card, wallet verification)
  # ---------------------------------------------------------------------------
  /api/public/v1/members/{publicSlug}:
    get:
      tags: [public-members]
      operationId: getPublicMemberProfile
      summary: Profil public d'un membre (respecte la visibilité champ par champ).
      parameters:
        - name: publicSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profil public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/public/v1/members/{publicSlug}/cv:
    get:
      tags: [public-members]
      operationId: getPublicMemberCv
      summary: Métadonnées du CV publié (URL de rendu PDF), si le membre l'a rendu public.
      parameters:
        - name: publicSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Référence du CV public
          content:
            application/json:
              schema:
                type: object
                required: [pdfUrl, language, generatedAt]
                properties:
                  pdfUrl:
                    type: string
                    format: uri
                  language:
                    type: string
                  generatedAt:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/NotFound"

  /api/public/v1/wallet/passes/{serialNumber}/verify:
    get:
      tags: [public-members]
      operationId: verifyWalletPass
      summary: Lien de vérification public d'un pass Wallet (jamais présenté comme pièce d'identité).
      parameters:
        - name: serialNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Résultat de vérification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletPassVerification"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # /api/member/v1 — profile
  # ---------------------------------------------------------------------------
  /api/member/v1/profile:
    get:
      tags: [member-profile]
      operationId: getMyProfile
      summary: Profil professionnel du membre connecté.
      security: [{ bearerAuth: [member] }]
      responses:
        "200":
          description: Profil professionnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalProfile"
    put:
      tags: [member-profile]
      operationId: updateMyProfile
      summary: Met à jour le profil professionnel du membre connecté.
      security: [{ bearerAuth: [member] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalProfile"
      responses:
        "200":
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalProfile"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/member/v1/membership:
    get:
      tags: [member-profile]
      operationId: getMyMembership
      summary: Niveau d'adhésion, statut et historique du membre connecté.
      security: [{ bearerAuth: [member] }]
      responses:
        "200":
          description: Adhésion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /api/member/v1/entitlements:
    get:
      tags: [member-profile]
      operationId: getMyEntitlements
      summary: >
        Droits actifs du membre connecté, dérivés de son `MembershipStatus` (voir
        `MembershipEntitlementService` côté frontend — recalculés côté backend à chaque
        webhook PSP qui change le statut, pas de recalcul admin nominal).
      security: [{ bearerAuth: [member] }]
      responses:
        "200":
          description: Droits actifs
          content:
            application/json:
              schema:
                type: object
                required: [status, entitlements]
                properties:
                  status:
                    $ref: "#/components/schemas/MembershipStatus"
                  entitlements:
                    type: array
                    items:
                      $ref: "#/components/schemas/MembershipEntitlement"

  /api/member/v1/ethical-charter/sign:
    post:
      tags: [member-profile]
      operationId: signEthicalCharter
      summary: Signature de la charte éthique en vigueur.
      security: [{ bearerAuth: [member] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
      responses:
        "201":
          description: Signature enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EthicalCharterSignature"

  # ---------------------------------------------------------------------------
  # /api/member/v1 — cotisation annuelle (adhésion & cotisation plan)
  # ---------------------------------------------------------------------------
  /api/member/v1/membership-fee/account:
    get:
      tags: [member-membership-fee]
      operationId: getMyMembershipFeeAccount
      summary: >
        Palier de cotisation et historique des paiements du membre connecté — sans
        raisonnement sur le cycle en cours (voir `MembershipFeeAccount`), qui est dérivé
        côté client (mock) / serveur (réel) par la fonction pure de calcul au prorata.
      security: [{ bearerAuth: [member] }]
      responses:
        "200":
          description: Compte de cotisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipFeeAccount"

  /api/member/v1/membership-fee/payments:
    post:
      tags: [member-membership-fee]
      operationId: payMyMembershipFee
      summary: >
        Enregistre le paiement (mocké — aucun processeur de paiement réel) de la
        cotisation du cycle courant, au montant prorata calculé côté appelant.
      security: [{ bearerAuth: [member] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipFeePaymentRequest"
      responses:
        "201":
          description: Paiement enregistré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipFeePayment"
        "400":
          $ref: "#/components/responses/ValidationError"

  # ---------------------------------------------------------------------------
  # /api/member/v1 — CV builder
  # ---------------------------------------------------------------------------
  /api/member/v1/cv/templates:
    get:
      tags: [member-cv]
      operationId: listCvTemplates
      summary: Templates de rendu PDF disponibles.
      security: [{ bearerAuth: [member] }]
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CvTemplate"

  /api/member/v1/cv:
    get:
      tags: [member-cv]
      operationId: listMyCvs
      summary: Liste des CV du membre connecté.
      security: [{ bearerAuth: [member] }]
      responses:
        "200":
          description: CV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cv"
    post:
      tags: [member-cv]
      operationId: createCv
      summary: Crée un CV (sections manuelles, import PDF/DOCX futur non couvert en V1).
      security: [{ bearerAuth: [member] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvCreation"
      responses:
        "201":
          description: CV créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cv"

  /api/member/v1/cv/{id}:
    get:
      tags: [member-cv]
      operationId: getCv
      summary: Détail d'un CV avec ses sections et traductions.
      security: [{ bearerAuth: [member] }]
      parameters:
        - $ref: "#/components/parameters/CvId"
      responses:
        "200":
          description: CV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cv"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [member-cv]
      operationId: updateCv
      summary: Met à jour les métadonnées d'un CV (template, langue source).
      security: [{ bearerAuth: [member] }]
      parameters:
        - $ref: "#/components/parameters/CvId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvCreation"
      responses:
        "200":
          description: CV mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cv"

  /api/member/v1/cv/{id}/sections:
    post:
      tags: [member-cv]
      operationId: addCvSection
      summary: Ajoute une section au CV.
      security: [{ bearerAuth: [member] }]
