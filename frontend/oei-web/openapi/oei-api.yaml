    put:
      tags: [institution-roles]
      operationId: updateInstitutionRoleAssignment
      summary: Change le rôle interne d'un membre de l'équipe institutionnelle (owner/admin uniquement).
      security: [{ bearerAuth: [institution] }]
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
