              schema:
                $ref: "#/components/schemas/GitSynchronization"

  /api/admin/v1/git/synchronizations:
    get:
      tags: [admin-git]
      operationId: listGitSynchronizations
      summary: Historique des synchronisations Git.
      security: [{ bearerAuth: [admin] }]
      responses:
        "200":
          description: Synchronisations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitSynchronization"

  /api/admin/v1/git/synchronizations/{id}:
    get:
      tags: [admin-git]
      operationId: getGitSynchronization
      summary: Détail d'une synchronisation (commits traités, erreurs).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Synchronisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitSynchronization"

  /api/admin/v1/git/synchronizations/latest/files:
    get:
      tags: [admin-git]
      operationId: listLatestGitSyncedFiles
      summary: >
        Fichiers Markdown (avec front matter) récupérés par la dernière synchronisation en
        lecture. Lecture seule, jamais d'écriture vers le dépôt Git.
      security: [{ bearerAuth: [admin] }]
      responses:
        "200":
          description: Fichiers synchronisés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitSyncedFile"

  # ---------------------------------------------------------------------------
  # /api/admin/v1 — institutions oversight
  # ---------------------------------------------------------------------------
  /api/admin/v1/institutions:
    get:
      tags: [admin-institutions]
      operationId: listAdminInstitutions
      summary: Liste de toutes les institutions (vérification, partenariat).
      security: [{ bearerAuth: [admin] }]
      responses:
        "200":
          description: Institutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Institution"
    post:
      tags: [admin-institutions]
      operationId: createAdminInstitution
      summary: Crée une institution en statut DRAFT (formulaire admin de création).
      security: [{ bearerAuth: [admin] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionAdminCreation"
      responses:
        "201":
          description: Institution créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"

  /api/admin/v1/institutions/{id}/approve:
    post:
      tags: [admin-institutions]
      operationId: approveInstitution
      summary: Fait passer une institution en statut APPROVED (dossier complet, avant activation).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Institution approuvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"

  /api/admin/v1/institutions/{id}/activate:
    post:
      tags: [admin-institutions]
      operationId: activateInstitution
      summary: >
        Active une institution APPROVED. Déclenche côté backend le provisioning Keycloak
        (création de l'utilisateur admin institutionnel, email d'activation, rôle institutionnel,
        association institutionId, changement de mot de passe forcé, audit) — voir
        .prompt/plan/final/02-PARTNERS-AND-INSTITUTION-ADMIN.md §Provisioning Keycloak. Ce contrat
        ne décrit que la transition d'état ; l'appel Keycloak Admin API réel n'existe pas encore.
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Institution activée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"

  /api/admin/v1/institutions/{id}/suspend:
    post:
      tags: [admin-institutions]
      operationId: suspendInstitution
      summary: Suspend une institution ACTIVE (soft delete — jamais de suppression physique).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Institution suspendue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"

  /api/admin/v1/institutions/{id}/revoke:
    post:
      tags: [admin-institutions]
      operationId: revokeInstitution
      summary: Révoque définitivement une institution (soft delete — raison obligatoire).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionRevocation"
      responses:
        "200":
          description: Institution révoquée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"

  /api/admin/v1/institutions/{id}/verify:
    post:
      tags: [admin-institutions]
      operationId: verifyInstitution
      summary: Vérifie/valide une institution (convention, documents).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Institution vérifiée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"

  /api/admin/v1/institutions/{id}/partnership:
    put:
      tags: [admin-institutions]
      operationId: updateInstitutionPartnership
      summary: Met à jour le niveau de partenariat d'une institution (dont validation Gold employeur).
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Partnership"
      responses:
        "200":
          description: Partenariat mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partnership"

