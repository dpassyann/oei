  # ---------------------------------------------------------------------------
  /api/member/v1/wallet/apple-pass:
    post:
      tags: [member-wallet]
      operationId: createAppleWalletPass
      summary: >
        Génère un objet Apple Wallet Pass MOCKÉ (aucun .pkpass signé réel en V1 — pas de
        certificat éditeur disponible). Représente la structure attendue pour le futur
        rendu serveur signé (voir ADR 0002 §Wallet).
      security: [{ bearerAuth: [member] }]
      responses:
        "201":
          description: Pass Apple Wallet mocké
