      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Opportunité clôturée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionOpportunity"

  # ---------------------------------------------------------------------------
