            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionMembership"
    delete:
      tags: [institution-roles]
      operationId: removeInstitutionRoleAssignment
      summary: Retire un membre de l'équipe institutionnelle.
      security: [{ bearerAuth: [institution] }]
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
