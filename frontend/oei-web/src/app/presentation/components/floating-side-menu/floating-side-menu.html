<nav class="oei-floating-side-menu" aria-label="{{ title() }}">
  @if (title()) {
    <p class="oei-floating-side-menu__title">{{ title() }}</p>
  }
  <ul class="oei-floating-side-menu__list">
    @for (link of links(); track link.fragment) {
      <li>
        <a
          class="oei-floating-side-menu__link"
          [class.oei-floating-side-menu__link--active]="activeFragment() === link.fragment"
          [fragment]="link.fragment"
          [routerLink]="[]"
          [title]="link.label"
          [attr.aria-current]="activeFragment() === link.fragment ? 'true' : null"
          (click)="scrollToSection(link.fragment, $event)"
          >{{ link.label }}</a
        >
      </li>
    }
  </ul>
</nav>
