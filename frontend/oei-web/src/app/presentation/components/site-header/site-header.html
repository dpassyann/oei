<header class="oei-header">
  <div class="oei-logo">
    <svg class="oei-logo__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M12 2 3 5v6c0 5.2 3.8 9.4 9 11 5.2-1.6 9-5.8 9-11V5l-9-3Z"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
      <circle cx="12" cy="11" r="3" stroke="currentColor" stroke-width="1.2" />
    </svg>
    <span class="oei-logo__text">
      <span class="oei-logo__line">{{ i18n.translate('brand.line1') }}</span>
      <span class="oei-logo__line oei-logo__line--strong">{{ i18n.translate('brand.line2') }}</span>
    </span>
  </div>

  <nav class="oei-nav">
    @for (link of navLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="oei-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="oei-nav__link"
        >{{ i18n.translate(link.labelKey) }}</a
      >
    }
  </nav>

  <div class="oei-header__actions">
    <button type="button" class="oei-icon-btn" [attr.aria-label]="i18n.translate('header.searchAria')">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6" />
        <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
    </button>
    <oei-language-switcher />
    <button type="button" class="oei-cta-member" (click)="keycloakAuth.login()">
      {{ i18n.translate('header.memberArea') }}
    </button>
  </div>
</header>
