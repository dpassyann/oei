<main class="oei-hero">
  <div class="oei-hero__content">
    <h1 class="oei-hero__title">{{ title() }}</h1>
    <p class="oei-hero__body">{{ body() }}</p>
    @if (isFallback()) {
      <p class="oei-fallback-banner">Traduction à venir dans cette langue.</p>
    }
    <button type="button" class="oei-cta-join">{{ i18n.translate('nav.join') }}</button>
  </div>

  <div class="oei-hero__visual" aria-hidden="true">
    <div class="oei-hero__globe">
      <svg viewBox="0 0 24 24" fill="none" class="oei-hero__shield">
        <path
          d="M12 2 3 5v6c0 5.2 3.8 9.4 9 11 5.2-1.6 9-5.8 9-11V5l-9-3Z"
          stroke="currentColor"
          stroke-width="1"
          stroke-linejoin="round"
        />
        <circle cx="12" cy="11" r="3.4" stroke="currentColor" stroke-width="0.8" />
        <path d="M12 8v6M9 11h6" stroke="currentColor" stroke-width="0.8" />
      </svg>
    </div>
  </div>
</main>
