<div class="oei-espace-membre-layout">
  <nav class="oei-espace-membre-nav" [attr.aria-label]="i18n.translate('espaceMembre.nav.title')">
    <p class="oei-espace-membre-nav__title">{{ i18n.translate('espaceMembre.nav.title') }}</p>
    <ul class="oei-espace-membre-nav__list">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            class="oei-espace-membre-nav__link"
            [routerLink]="['/espace-membre', link.path]"
            routerLinkActive="oei-espace-membre-nav__link--active"
            >{{ i18n.translate(link.labelKey) }}</a
          >
        </li>
      }
    </ul>
  </nav>
  <div class="oei-espace-membre-layout__content">
    <router-outlet />
  </div>
</div>
