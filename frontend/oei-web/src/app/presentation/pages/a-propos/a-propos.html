@if (notFound()) {
  <main class="oei-page">
    <h1 class="oei-page__title">{{ i18n.translate('aPropos.title') }}</h1>
    <p class="oei-page__empty">{{ i18n.translate('aPropos.notFound') }}</p>
  </main>
} @else {
  <main class="oei-a-propos-page">
    <div class="oei-a-propos-page__content">
      <h1 class="oei-page__title">{{ i18n.translate('aPropos.title') }}</h1>

      @if (isFallback()) {
        <p class="oei-fallback-banner">{{ i18n.translate('aPropos.fallbackNotice') }}</p>
      }

      @if (loading()) {
        <p class="oei-a-propos-page__loading">{{ i18n.translate('aPropos.loading') }}</p>
      } @else {
        <article class="oei-a-propos-page__body" [innerHTML]="visionMissionHtml()"></article>
        <article class="oei-a-propos-page__body" [innerHTML]="pourquoiUnOrdreHtml()"></article>
      }
    </div>

    <oei-floating-side-menu
      [title]="i18n.translate('aPropos.tableOfContents')"
      [links]="sideMenuLinks()"
    />
  </main>
}
