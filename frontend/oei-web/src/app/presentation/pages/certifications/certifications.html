<main class="oei-page">
  <h1 class="oei-page__title">{{ i18n.translate('certifications.title') }}</h1>

  <p class="oei-page__body">
    {{ i18n.translate('certifications.intro') }}
  </p>

  <ol class="oei-page__levels">
    @for (i of levelIndexes; track i) {
      <li class="oei-page__level">{{ i18n.translate('certifications.levels.' + i) }}</li>
    }
  </ol>
</main>
