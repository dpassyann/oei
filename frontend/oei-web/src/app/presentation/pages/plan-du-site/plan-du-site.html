<main class="oei-page">
  <h1 class="oei-page__title">{{ i18n.translate('planDuSite.title') }}</h1>

  <ul class="oei-page__links">
    @for (link of links; track link.path) {
      <li class="oei-page__link-item">
        <a [routerLink]="link.path" class="oei-page__link">{{ i18n.translate('planDuSite.links.' + link.key) }}</a>
      </li>
    }
  </ul>
</main>
