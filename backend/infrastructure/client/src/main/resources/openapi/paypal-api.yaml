# -----------------------------------------------------------------------------------------
# REDUCED SUBSET OF THE PAYPAL ORDERS V2 / PAYMENTS API — FIELD-VERIFIED AGAINST THE REAL
# VENDOR SPECS.
#
# PayPal publishes per-product OpenAPI specs on its developer portal (Orders v2, Payments);
# this file keeps ONLY the four operations the OEI store feature actually needs (create
# Order, capture Order, retrieve Order, refund a Capture — exactly the four operations
# listed in .prompt/plan/store/04-architecture-technique.md §2).
#
# Every field name/status enum below (order_request.intent/purchase_units,
# purchase_unit_request.reference_id/amount, money.currency_code/value, order.id/status,
# refund.id/status with CREATED/APPROVED/COMPLETED/VOIDED and
# CANCELLED/FAILED/PENDING/COMPLETED status vocabularies) was checked field-by-field on
# 2026-08-16 against real copies of the vendor Orders v2 (paths /v2/checkout/orders,
# /v2/checkout/orders/{id}, /v2/checkout/orders/{id}/capture) and Payments
# (/v2/payments/captures/{capture_id}/refund) specs — every one matched exactly, so no
# schema/operationId change was needed here (the {captureId} path-parameter name is a purely
# cosmetic, internally-consistent choice — it has no bearing on the generated client, unlike
# the vendor's {capture_id}). The full vendor files used for that check are gitignored (see
# .gitignore) and never committed — they are multi-MB third-party artifacts, not this
# project's own source.
# -----------------------------------------------------------------------------------------
openapi: 3.0.3
info:
  title: PayPal Orders v2 API (OEI reduced subset)
  version: "v2-reduced"
  description: >
    Hand-authored reduced subset of the PayPal Orders v2 API — see file header comment above.
servers:
  - url: https://api-m.sandbox.paypal.com/v2
paths:
  /checkout/orders:
    post:
      operationId: createPaypalOrder
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaypalOrderRequest'
      responses:
        '201':
          description: The created PayPal order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaypalOrder'
        default:
          description: PayPal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaypalErrorResponse'
  /checkout/orders/{id}:
    get:
      operationId: getPaypalOrder
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The PayPal order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaypalOrder'
        default:
          description: PayPal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaypalErrorResponse'
  /checkout/orders/{id}/capture:
    post:
      operationId: capturePaypalOrder
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The captured PayPal order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaypalOrder'
        default:
          description: PayPal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaypalErrorResponse'
  /payments/captures/{captureId}/refund:
    post:
      operationId: refundPaypalCapture
      tags: [Payments]
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaypalCaptureRequest'
      responses:
        '201':
          description: The created refund.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaypalRefund'
        default:
          description: PayPal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaypalErrorResponse'
components:
  schemas:
    CreatePaypalOrderRequest:
      type: object
      required: [intent, purchase_units]
      properties:
        intent:
          type: string
          example: CAPTURE
        purchase_units:
          type: array
          items:
            $ref: '#/components/schemas/PaypalPurchaseUnit'
    PaypalPurchaseUnit:
      type: object
      required: [amount]
      properties:
        reference_id:
          type: string
          description: OEI order id, for reconciliation on PayPal's side.
        amount:
          $ref: '#/components/schemas/PaypalAmount'
    PaypalAmount:
      type: object
      required: [currency_code, value]
      properties:
        currency_code:
          type: string
        value:
          type: string
          description: Decimal string amount, e.g. "19.90".
    RefundPaypalCaptureRequest:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/PaypalAmount'
    PaypalOrder:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          description: CREATED | APPROVED | COMPLETED | VOIDED.
    PaypalRefund:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          description: COMPLETED | PENDING | FAILED.
    PaypalErrorResponse:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              issue:
                type: string
              description:
                type: string
