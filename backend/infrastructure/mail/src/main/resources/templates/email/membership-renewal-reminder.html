<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="#{email.renewal-reminder.subject}">Cotisation OEI</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef1f6;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="background-color:#ffffff;border:1px solid rgba(10,30,63,0.15);border-radius:8px;font-family:Arial,Helvetica,sans-serif;overflow:hidden;">
        <tbody th:replace="~{email/fragments/shell :: header}"></tbody>
        <tr>
          <td style="padding:32px;background-color:#f7f4ec;color:#1a1a1a;font-size:15px;line-height:1.6;">
            <p th:text="#{email.renewal-reminder.greeting(${member.displayName()})}">Bonjour,</p>
            <p th:text="#{email.renewal-reminder.body(${cycleYear})}">Cycle</p>
            <p th:text="#{email.renewal-reminder.cta}">CTA</p>
            <div th:with="ctaUrl=${publicBaseUrl} + '/espace-membre/cotisation', ctaLabel=#{email.renewal-reminder.button}">
              <table th:replace="~{email/fragments/shell :: ctaButton}"></table>
            </div>
            <p th:utext="#{email.renewal-reminder.signature}">Signature</p>
          </td>
        </tr>
        <tbody th:replace="~{email/fragments/shell :: footer}"></tbody>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
