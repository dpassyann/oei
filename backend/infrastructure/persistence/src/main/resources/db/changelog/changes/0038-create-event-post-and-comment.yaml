databaseChangeLog:
  - changeSet:
      id: 0038-create-event-post-and-comment
      author: oei-backend
      changes:
        - createTable:
            tableName: event_post
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_post_event
                    references: event(id)
              - column:
                  name: author_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_post_member
                    references: member(id)
              - column:
                  name: author_name
                  type: varchar(255)
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: photo_url
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: liked_by_json
                  type: jsonb
        - createTable:
            tableName: event_comment
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_comment_event
                    references: event(id)
              - column:
                  name: post_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_comment_post
                    references: event_post(id)
              - column:
                  name: author_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_comment_member
                    references: member(id)
              - column:
                  name: author_name
                  type: varchar(255)
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(10)
                  constraints:
                    nullable: false
