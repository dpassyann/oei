databaseChangeLog:
  - changeSet:
      id: 0031-create-content-version
      author: oei-backend
      comment: >
        Never overwritten in place -- updateAdminContent always inserts a new row (see
        global.oei.domain.shared.content.Content's Javadoc, no destructive edit of a
        published version).
      changes:
        - createTable:
            tableName: content_version
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: content_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_content_version_content
                    references: content(id)
              - column:
                  name: version
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: language
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: front_matter_json
                  type: jsonb
              - column:
                  name: author_ids_json
                  type: jsonb
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
