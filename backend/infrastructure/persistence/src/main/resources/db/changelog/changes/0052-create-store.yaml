databaseChangeLog:
  - changeSet:
      id: 0052-create-store
      author: oei-backend
      comment: >
        Store bounded context: product catalog (open reference-data model, not a closed
        enum -- see 01-catalogue-produits.md §1), business card templates, orders/order
        lines, and payments. Fulfillment is explicitly mocked -- see Order's Javadoc.
      changes:
        - createTable:
            tableName: product_category
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(60)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: label
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: fulfillment_kind
                  type: varchar(30)
                  constraints:
                    nullable: false
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: category_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_category
                    references: product_category(id)
              - column:
                  name: sku
                  type: varchar(60)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: unit_price_amount
                  type: numeric(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: unit_price_currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: customizable
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createTable:
            tableName: business_card_template
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: preview_url
                  type: varchar(500)
                  constraints:
                    nullable: false
        - createTable:
            tableName: store_order
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_store_order_member
                    references: member(id)
              - column:
                  name: total_amount
                  type: numeric(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: total_currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: paid_at
                  type: timestamptz
        - createTable:
            tableName: store_order_line
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_store_order_line_order
                    references: store_order(id)
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_store_order_line_product
                    references: product(id)
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: unit_price_amount_at_order
                  type: numeric(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: source_reference_id
                  type: uuid
              - column:
                  name: bc_template_id
                  type: uuid
              - column:
                  name: bc_display_name
                  type: varchar(200)
              - column:
                  name: bc_title
                  type: varchar(200)
              - column:
                  name: bc_email
                  type: varchar(320)
              - column:
                  name: bc_phone
                  type: varchar(40)
              - column:
                  name: bc_qr_code_url
                  type: varchar(500)
              - column:
                  name: bc_membership_tier_at_order
                  type: varchar(20)
        - createTable:
            tableName: store_payment
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_store_payment_order
                    references: store_order(id)
              - column:
                  name: payment_method
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: provider_reference
                  type: varchar(200)
              - column:
                  name: amount
                  type: numeric(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: failure_reason
                  type: varchar(30)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: succeeded_at
                  type: timestamptz
