databaseChangeLog:
  - changeSet:
      id: 0045-create-content-comment
      author: oei-backend
      comment: >
        Comments on either a content contribution (consultation discussion) or directly on a
        published content -- exactly one of contribution_id/content_id is expected to be set
        per row, both nullable per the OpenAPI contract.
      changes:
        - createTable:
            tableName: content_comment
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: contribution_id
                  type: uuid
                  constraints:
                    nullable: true
                    foreignKeyName: fk_content_comment_contribution
                    references: content_contribution(id)
              - column:
                  name: content_id
                  type: uuid
                  constraints:
                    nullable: true
                    foreignKeyName: fk_content_comment_content
                    references: content(id)
              - column:
                  name: author_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
