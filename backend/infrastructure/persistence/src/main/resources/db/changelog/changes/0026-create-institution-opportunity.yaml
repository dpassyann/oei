databaseChangeLog:
  - changeSet:
      id: 0026-create-institution-opportunity
      author: oei-backend
      changes:
        - createTable:
            tableName: institution_opportunity
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: institution_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_institution_opportunity_institution
                    references: institution(id)
              - column:
                  name: type
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
              - column:
                  name: status
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: timestamptz
