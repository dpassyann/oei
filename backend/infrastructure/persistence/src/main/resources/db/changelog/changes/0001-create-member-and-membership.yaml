databaseChangeLog:
  - changeSet:
      id: 0001-create-member-table
      author: oei-backend
      changes:
        - createTable:
            tableName: member
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: public_slug
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: display_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: legal_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: locale
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  # Free text (e.g. "Suisse", "France"), same convention as
                  # NetworkExpert.country/Institution.country/EventLocation.country --
                  # never a strict ISO-3166 2-letter code, despite the column name.
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: registered_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: last_modified_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_by
                  type: varchar(255)

  - changeSet:
      id: 0002-create-membership-table
      author: oei-backend
      changes:
        - createTable:
            tableName: membership
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_membership_member
                    references: member(id)
              - column:
                  name: tier
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: renewed_at
                  type: timestamptz
              - column:
                  name: ends_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: last_modified_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_by
                  type: varchar(255)
