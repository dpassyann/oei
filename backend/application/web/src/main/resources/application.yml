spring:
  application:
    name: ${OEI_APPLICATION_NAME:${oei.name}}
    version: "@version@"
    description: "@description@"
  profiles:
    include: ${OEI_PROFILES_INCLUDE:clients}
    group:
      clients: ${OEI_EXTERNAL_CLIENTS_PROFILES:stripe,paypal,linkedin}
  # Resilience: Java 25 virtual threads (recommended with Spring Boot 4, avoids thread pinning).
  threads:
    virtual:
      enabled: true
  datasource:
    # Dev-local Postgres, exposed on the host by infra/docker-compose.yml (see comment
    # there: "dev local uniquement"). OEI_DB_USER/OEI_DB_PASSWORD default to the
    # infra/postgres-init/01-create-oei-app-db.sql dev role — never commit a real password.
    url: jdbc:postgresql://localhost:5432/oei
    username: ${OEI_DB_USER:oei_app}
    password: ${OEI_DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OEI_OIDC_ISSUER_URI:http://localhost:8081/realms/oei}
  # Amazon SES over standard SMTP (see .prompt/plan/store/03-emails-transactionnels.md §1):
  # EmailNotificationAdapter never sends a real email outside this configuration. Dev-local
  # defaults point nowhere real (localhost:1025, e.g. a local MailHog/Mailpit container) --
  # never a real SES endpoint/credential committed here, same posture as OEI_DB_PASSWORD.
  mail:
    host: ${OEI_SMTP_HOST:localhost}
    port: ${OEI_SMTP_PORT:1025}
    username: ${OEI_SMTP_USERNAME:}
    password: ${OEI_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${OEI_SMTP_AUTH:false}
          starttls:
            enable: ${OEI_SMTP_STARTTLS:false}

oei:
  name: "@name@"
  cors:
    allowed-origins: ${OEI_CORS_ALLOWED_ORIGINS:https://theitorder.global,https://www.theitorder.global,http://localhost:4300}
  logging:
    loki:
      # Endpoint HTTP Loki4j (backend -> Loki direct). Depuis l'hôte local: localhost;
      # depuis un conteneur sur oei-net: utiliser http://loki:3100/loki/api/v1/push.
      url: ${OEI_LOKI_URL:http://localhost:3100/loki/api/v1/push}
  # Public site base URL, used to build absolute links in transactional emails (header/footer
  # nav, CTA buttons) — never hardcoded per-template, so a domain change is a one-property fix.
  public-base-url: ${OEI_PUBLIC_BASE_URL:https://theitorder.global}
  mail:
    # From address for every EmailNotificationAdapter send; must be a verified SES identity
    # in production.
    from: ${OEI_MAIL_FROM:no-reply@theitorder.global}
  security:
    public-urls:
      - /actuator/health
      - /actuator/health/**
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # /api/public/** backs PublicEventsApi/PublicAccountsApi/PublicInstitutionsApi/etc:
      # genuinely anonymous, visitor-facing endpoints (event listings, anonymized salary
      # insights, public member/institution profiles) — never require a bearer token.
      - /api/public/**
      # /content/** backs the legacy, unversioned ContentLegacyApi (content-legacy tag) --
      # no `security:` override in the OpenAPI contract (document-level `security: []`
      # applies), so genuinely anonymous.
      - /content/**
      # /api/v1/** backs the legacy, unversioned HomeLegacyApi (home-legacy tag) -- same
      # reasoning as /content/** above.
      - /api/v1/**
  media:
    storage:
      base-url: ${OEI_MEDIA_STORAGE_BASE_URL:https://mock-media.oei.local/}

management:
  endpoints:
    web:
      exposure:
        # health + info toujours exposés ; prometheus activé pour le scraping Prometheus
        # (profil obs, infra/docker-compose.yml). Ne pas exposer env/beans/mappings en prod.
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active:default}
server:
  shutdown: graceful