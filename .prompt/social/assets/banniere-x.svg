  <rect width="1500" height="500" fill="#0a1e3f"/>
  <rect x="0" y="0" width="1500" height="4" fill="#e8a530"/>
  <rect x="0" y="496" width="1500" height="4" fill="#e8a530"/>

  <!-- Zone centrale masquee par la photo de profil ronde de X (bas-gauche) : on decale le contenu a droite -->
  <g transform="translate(420 250) scale(0.5)" fill="none" stroke="#e8a530" stroke-width="12"
