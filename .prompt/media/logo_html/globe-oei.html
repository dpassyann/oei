<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OEI — Globe néon interconnecté</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#0A1E3F;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:min(90vmin,680px);aspect-ratio:1/1;}
  #stage canvas{display:block;width:100%;height:100%;}
  #shield{position:absolute;left:50%;top:50%;width:23%;transform:translate(-50%,-52%);pointer-events:none;
    animation:shieldGlow 3.2s ease-in-out infinite;}
  @keyframes shieldGlow{
    0%,100%{filter:drop-shadow(0 0 5px rgba(232,165,48,.35)) drop-shadow(0 0 14px rgba(232,165,48,.18));}
    50%{filter:drop-shadow(0 0 8px rgba(232,165,48,.65)) drop-shadow(0 0 22px rgba(232,165,48,.35));}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="globe"></canvas>
  <svg id="shield" viewBox="0 0 100 122" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 5 L89 19 V57 C89 87 71 104 50 116 C29 104 11 87 11 57 V19 Z"
          fill="rgba(10,30,63,0.7)" stroke="#E8A530" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="50" cy="57" r="23" stroke="#E8A530" stroke-width="1.8"/>
    <ellipse cx="50" cy="57" rx="10.5" ry="23" stroke="#E8A530" stroke-width="1.2"/>
    <path d="M28.5 49 H71.5 M28.5 65 H71.5" stroke="#E8A530" stroke-width="1.2"/>
    <path d="M50 34 V24" stroke="#E8A530" stroke-width="1.4"/><circle cx="50" cy="21.5" r="2" fill="#E8A530"/>
    <path d="M66 40 L73 33 H79" stroke="#E8A530" stroke-width="1.4"/><circle cx="81.5" cy="33" r="2" fill="#E8A530"/>
    <path d="M73 57 H81" stroke="#E8A530" stroke-width="1.4"/><circle cx="83.5" cy="57" r="2" fill="#E8A530"/>
    <path d="M34 40 L27 33 H21" stroke="#E8A530" stroke-width="1.4"/><circle cx="18.5" cy="33" r="2" fill="#E8A530"/>
    <path d="M27 57 H19" stroke="#E8A530" stroke-width="1.4"/><circle cx="16.5" cy="57" r="2" fill="#E8A530"/>
    <path d="M64 76 L71 83" stroke="#E8A530" stroke-width="1.4"/><circle cx="73" cy="85" r="2" fill="#E8A530"/>
    <path d="M36 76 L29 83" stroke="#E8A530" stroke-width="1.4"/><circle cx="27" cy="85" r="2" fill="#E8A530"/>
  </svg>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const NAVY = 0x0A1E3F, NAVY2 = 0x12295A, GOLD = 0xE8A530;
const canvas = document.getElementById('globe');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 50);
camera.position.set(0, 0.72, 3.8);
camera.lookAt(0,0,0);
const controls = new OrbitControls(camera, canvas);
controls.enableZoom = false; controls.enablePan = false; controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(2.5, 3, 2); scene.add(key);
const fill = new THREE.DirectionalLight(NAVY2, 2.0); fill.position.set(-2, -1, -2); scene.add(fill);

const globe = new THREE.Group(); scene.add(globe);

function ll(lat, lon, r){
  const phi = (90-lat)*Math.PI/180, theta = (lon+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
}

// masse du globe (la texture des continents est appliquée après chargement)
const globeMat = new THREE.MeshStandardMaterial({color:NAVY, roughness:0.75, metalness:0.15, transparent:true, opacity:0.55, depthWrite:false});
globe.add(new THREE.Mesh(new THREE.SphereGeometry(0.982, 64, 64), globeMat));

// grille lat/lon discrète (relief navy clair)
{
  const pts = [];
  for(let lat=-60; lat<=60; lat+=30){
    for(let i=0;i<96;i++){
      pts.push(ll(lat, i/96*360-180, 1.0), ll(lat, (i+1)/96*360-180, 1.0));
    }
  }
  for(let lon=-180; lon<180; lon+=30){
    for(let i=0;i<48;i++){
      pts.push(ll(-90+i/48*180, lon, 1.0), ll(-90+(i+1)/48*180, lon, 1.0));
    }
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  globe.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:NAVY2, transparent:true, opacity:0.85})));
}

// continents réels (TopoJSON land-110m) : masse navy claire + côtes dorées filaires
fetch('https://unpkg.com/world-atlas@2.0.2/land-110m.json').then(r => r.json()).then(topo => {
  const tf = topo.transform;
  const arcs = topo.arcs.map(arc => { let x=0,y=0; return arc.map(([dx,dy]) => { x+=dx; y+=dy;
    return [x*tf.scale[0]+tf.translate[0], y*tf.scale[1]+tf.translate[1]]; }); });
  function ring(idxs){ let pts=[]; for(const i of idxs){ let a = i<0 ? arcs[~i].slice().reverse() : arcs[i];
    if(pts.length) a = a.slice(1); pts = pts.concat(a); } return pts; }
  const polys = topo.objects.land.geometries[0].arcs.map(poly => poly.map(ring)); // [poly][ring][ [lon,lat] ]
  // texture équirectangulaire : océan navy, terres navy clair
  const W=2048, H=1024, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x = c.getContext('2d');
  x.fillStyle = '#0A1E3F'; x.fillRect(0,0,W,H);
  x.fillStyle = '#16305F';
  for(const poly of polys){
    x.beginPath();
    for(const rg of poly){
      rg.forEach(([lon,lat],i) => { const px=(lon+180)/360*W, py=(90-lat)/180*H; i?x.lineTo(px,py):x.moveTo(px,py); });
      x.closePath();
    }
    x.fill('evenodd');
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  globeMat.map = tex; globeMat.color.set(0xffffff); globeMat.needsUpdate = true;
  // côtes en filaire doré discret
  const coastMat = new THREE.LineBasicMaterial({color:GOLD, transparent:true, opacity:0.4});
  const segs = [];
  for(const poly of polys) for(const rg of poly){
    for(let i=0;i<rg.length-1;i++){
      segs.push(ll(rg[i][1], rg[i][0], 1.003), ll(rg[i+1][1], rg[i+1][0], 1.003));
    }
  }
  globe.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(segs), coastMat));
  renderer.render(scene, camera);
}).catch(err => console.warn('continents non chargés', err));

// texture de halo (dégradé radial doré)
function glowTexture(inner, outer){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0, inner); g.addColorStop(0.35, outer); g.addColorStop(1, 'rgba(232,165,48,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); return t;
}
const nodeGlowTex = glowTexture('rgba(255,255,255,0.95)','rgba(232,165,48,0.55)');
const pulseTex = glowTexture('rgba(255,240,210,1)','rgba(232,165,48,0.7)');

// nœuds (villes connectées)
const CITIES = [
  [40.7,-74],[37.7,-122.4],[-23.5,-46.6],[51.5,0],[48.8,2.3],[46.2,6.1],[6.5,3.4],[-26.2,28],
  [25.2,55.3],[19,72.8],[1.35,103.8],[35.7,139.7],[-33.8,151.2],[-1.3,36.8]
];
const nodeGlows = [];
{
  const dotGeo = new THREE.SphereGeometry(0.012, 16, 16);
  const dotMat = new THREE.MeshBasicMaterial({color:GOLD});
  CITIES.forEach((c, i) => {
    const p = ll(c[0], c[1], 1.005);
    const dot = new THREE.Mesh(dotGeo, dotMat); dot.position.copy(p); dot.name = 'node-'+i; globe.add(dot);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:nodeGlowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
    spr.position.copy(p); spr.scale.setScalar(0.11);
    spr.userData.phase = i * 0.9;
    globe.add(spr); nodeGlows.push(spr);
  });
}

// arcs de connexion (grands arcs suivant la courbure)
const LINKS = [[0,3],[0,2],[0,11],[1,11],[1,0],[2,6],[3,4],[3,8],[4,5],[4,6],[5,8],[6,13],[7,13],[7,8],[8,9],[9,10],[10,11],[10,12],[11,12],[13,8]];
const pulses = [];
{
  const arcMat = new THREE.LineBasicMaterial({color:GOLD, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending, depthWrite:false});
  LINKS.forEach((lk, i) => {
    const a = ll(CITIES[lk[0]][0], CITIES[lk[0]][1], 1.005);
    const b = ll(CITIES[lk[1]][0], CITIES[lk[1]][1], 1.005);
    const ang = a.angleTo(b);
    const N = 64, pts = [];
    for(let j=0;j<=N;j++){
      const t = j/N;
      const p = a.clone().lerp(b, t).normalize().multiplyScalar(1.005 + Math.sin(t*Math.PI)*ang*0.09);
      pts.push(p);
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), arcMat));
    // pulse "comète" : tête + traîne
    const group = [];
    for(let k=0;k<4;k++){
      const s = new THREE.Sprite(new THREE.SpriteMaterial({map:pulseTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:1-k*0.24}));
      s.scale.setScalar(0.055*(1-k*0.18));
      globe.add(s); group.push(s);
    }
    pulses.push({curve, group, speed:0.055+ (i%7)*0.012, offset:(i*0.37)%1});
  });
}

// bouclier au centre du globe (fixe, billboard) — rasterisé depuis le SVG
const shieldGroup = new THREE.Group(); scene.add(shieldGroup);
{
  const svgEl = document.getElementById('shield');
  svgEl.style.display = 'none';
  const xml = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = 512; c.height = 624;
    c.getContext('2d').drawImage(img, 0, 0, 512, 624);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(0.66, 0.805),
      new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false, opacity:0.7})
    );
    plane.name = 'shield'; shieldGroup.add(plane);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:nodeGlowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0.2}));
    glow.name = 'shieldGlow'; glow.scale.setScalar(1.15); glow.position.z = -0.02;
    shieldGroup.add(glow);
    renderer.render(scene, camera);
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
}

// halo atmosphérique bleu nuit (rim, doux)
{
  const mat = new THREE.ShaderMaterial({
    uniforms:{ c:{value:new THREE.Color(0x2A4B8F)} },
    vertexShader:`varying vec3 vN; varying vec3 vP;
      void main(){ vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.0); vP = mv.xyz; gl_Position = projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 c; varying vec3 vN; varying vec3 vP;
      void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(-vP))), 3.5); gl_FragColor = vec4(c, f*0.55); }`,
    transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.16, 64, 64), mat));
}
// léger reflet spéculaire blanc : point light
const spec = new THREE.PointLight(0xffffff, 3, 8); spec.position.set(1.6, 1.8, 2.2); scene.add(spec);

function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);

const ROT_PERIOD = 50; // secondes par tour
const clock = new THREE.Clock();
let t = 0;
renderer.setAnimationLoop(() => {
  t += Math.min(clock.getDelta(), 0.05);
  globe.rotation.y = t * (2*Math.PI/ROT_PERIOD);
  nodeGlows.forEach(s => {
    const b = 0.72 + 0.28*Math.sin(t*2*Math.PI/3.2 + s.userData.phase);
    s.material.opacity = b; s.scale.setScalar(0.09 + 0.035*b);
  });
  pulses.forEach(p => {
    const head = (t*p.speed + p.offset) % 1;
    p.group.forEach((s, k) => {
      const f = head - k*0.02;
      if(f < 0){ s.visible = false; return; }
      s.visible = true;
      s.position.copy(p.curve.getPoint(f));
    });
  });
  shieldGroup.quaternion.copy(camera.quaternion);
  const sg = shieldGroup.getObjectByName('shieldGlow');
  if(sg) sg.material.opacity = 0.14 + 0.1*Math.sin(t*2*Math.PI/3.2);
  controls.update();
  renderer.render(scene, camera);
});
resize();
renderer.render(scene, camera);
window.__renderer = renderer;
</script>
</body>
</html>
