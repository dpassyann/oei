name: oei

networks:
  oei-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OEI_USER}
      POSTGRES_PASSWORD: ${OEI_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed only by infra/postgres-init/01-create-oei-app-db.sh, to provision the
      # "oei" application database/role below. Keycloak keeps using POSTGRES_DB/OEI_USER
      # unchanged.
      OEI_APP_PASSWORD: ${OEI_APP_PASSWORD:-changeme}
    ports:
      # dev local uniquement — le backend Spring tourne en dehors de docker-compose.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - oei-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OEI_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev --import-realm --health-enabled=true --legacy-observability-interface=true
    environment:
      KEYCLOAK_ADMIN: ${OEI_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${OEI_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${OEI_USER}
      KC_DB_PASSWORD: ${OEI_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - ../keycloak/realm-export:/opt/keycloak/data/import
      - ../keycloak/themes/oei:/opt/keycloak/themes/oei
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oei-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${OEI_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - oei-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && echo -e \"GET /minio/health/live HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && response=$$(cat <&3) && [[ \"$$response\" == *\"200 OK\"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-07-11T18-01-28Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - oei-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${OEI_PASSWORD} &&
      mc mb -p local/oei-public &&
      mc mb -p local/oei-membership &&
      mc anonymous set download local/oei-public &&
      mc anonymous set none local/oei-membership
      "
