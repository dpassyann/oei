name: oei

networks:
  oei-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  # ── Observabilité (profile: obs) ──────────────────────────────────────────
  pgadmin-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ── Core ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OEI_USER}
      POSTGRES_PASSWORD: ${OEI_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by postgres-init (below) AND by infra/postgres-init/01-create-oei-app-db.sh
      # on first-boot via /docker-entrypoint-initdb.d (both paths are idempotent).
      OEI_APP_PASSWORD: ${OEI_APP_PASSWORD:-changeme}
    ports:
      # dev local uniquement — le backend Spring tourne en dehors de docker-compose.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - oei-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OEI_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      oei.service: postgres
      oei.env: local

  # Ensures the oei_app role + oei database exist even when the postgres-data
  # volume was initialised before these were added (Docker skips initdb scripts
  # on pre-existing volumes). Idempotent — safe to run on every `compose up`.
  postgres-init:
    image: postgres:17
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Must match the names expected by 01-create-oei-app-db.sh
      POSTGRES_USER: ${OEI_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      OEI_APP_PASSWORD: ${OEI_APP_PASSWORD:-changeme}
      # Remote psql connection settings
      PGHOST: postgres
      PGPASSWORD: ${OEI_PASSWORD}
    volumes:
      - ./postgres-init:/scripts:ro
    networks:
      - oei-net
    entrypoint: /bin/bash /scripts/01-create-oei-app-db.sh

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev --import-realm --health-enabled=true --legacy-observability-interface=true
    environment:
      KEYCLOAK_ADMIN: ${OEI_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${OEI_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${OEI_USER}
      KC_DB_PASSWORD: ${OEI_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - ../keycloak/realm-export:/opt/keycloak/data/import
      - ../keycloak/themes/oei:/opt/keycloak/themes/oei
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oei-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
    labels:
      oei.service: keycloak
      oei.env: local

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${OEI_PASSWORD}
      # Expose Prometheus metrics without auth token (local dev only — never use in prod)
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio-data:/data
    networks:
      - oei-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && echo -e \"GET /minio/health/live HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && response=$$(cat <&3) && [[ \"$$response\" == *\"200 OK\"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      oei.service: minio
      oei.env: local

  minio-init:
    image: minio/mc:RELEASE.2024-07-11T18-01-28Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - oei-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${OEI_PASSWORD} &&
      mc mb -p local/oei-public &&
      mc mb -p local/oei-membership &&
      mc anonymous set download local/oei-public &&
      mc anonymous set none local/oei-membership
      "

  # ── Observabilité (profile: obs) ──────────────────────────────────────────
  # Démarrage : ./infra/scripts/dev-up.sh --obs
  # Arrêt     : ./infra/scripts/dev-down.sh --obs
  #
  # URLs (local) :
  #   Grafana    → http://localhost:3000  (admin / OEI_PASSWORD)
  #   Prometheus → http://localhost:9090
  #   Loki       → http://localhost:3100
  #   pgAdmin    → http://localhost:5050  (PGADMIN_EMAIL / OEI_PASSWORD)
  #   Mailpit UI → http://localhost:8025  SMTP → localhost:1025
  # ──────────────────────────────────────────────────────────────────────────

  pgadmin:
    profiles: [obs]
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@oei.local}
      PGADMIN_DEFAULT_PASSWORD: ${OEI_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - oei-net
    depends_on:
      postgres:
        condition: service_healthy

  # Simulateur SMTP local — capture tous les emails sans les envoyer.
  # Le backend est déjà configuré pour pointer sur localhost:1025 (application.yml).
  mailpit:
    profiles: [obs]
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP (correspond à OEI_SMTP_HOST/OEI_SMTP_PORT dans application.yml)
    networks:
      - oei-net

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    networks:
      - oei-net

  loki:
    profiles: [obs]
    image: grafana/loki:3.1.0
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - oei-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Collecte les logs de tous les conteneurs Docker du projet via l'API Docker (socket).
  # Compatible macOS/Docker Desktop — ne nécessite pas l'accès à /var/lib/docker/containers.
  promtail:
    profiles: [obs]
    image: grafana/promtail:3.1.0
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - oei-net
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${OEI_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - oei-net
    depends_on:
      - prometheus
      - loki
