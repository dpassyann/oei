# identity-provider-link.ftl
identityProviderLinkIntro=Es wurde beantragt, Ihr Konto „{0}“ mit dem Identitätsanbieter „{1}“ bei {2} zu verknüpfen. Falls Sie das waren, klicken Sie auf die Schaltfläche unten, um zu bestätigen.
