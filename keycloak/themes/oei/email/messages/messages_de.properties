emailFooterUnsubscribe=Um Ihre Kommunikationseinstellungen zu verwalten, kontaktieren Sie uns bitte.

# email-verification.ftl
emailVerificationGreetingName=Hallo {0},
emailVerificationGreetingGeneric=Hallo,
emailVerificationIntro=Mit dieser E-Mail-Adresse wurde ein {0}-Konto erstellt. Falls Sie das waren, bestätigen Sie Ihre Adresse, indem Sie auf die Schaltfläche unten klicken.
