identityProviderLinkExpiry=Dieser Link läuft in {0} ab.
identityProviderLinkIgnore=Falls Sie diese Konten nicht verknüpfen möchten, ignorieren Sie diese Nachricht einfach. Nach der Verknüpfung können Sie sich bei {0} über {1} anmelden.

# email-test.ftl
emailTestIntro=Dies ist eine Testnachricht, die von der SMTP-Konfiguration von {0} gesendet wurde.

