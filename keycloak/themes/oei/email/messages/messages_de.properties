# password-reset.ftl
passwordResetGreetingName=Hallo {0},
passwordResetGreetingGeneric=Hallo,
passwordResetIntro=Es wurde beantragt, das Passwort Ihres {0}-Kontos zurückzusetzen. Falls Sie das waren, klicken Sie auf die Schaltfläche unten, um ein neues Passwort festzulegen.
