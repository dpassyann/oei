emailOtpSubject=Ihr Bestätigungscode
emailOtpGreetingName=Hallo {0},
emailOtpGreetingGeneric=Hallo,
emailOtpIntro=Bitte verwenden Sie den folgenden Code, um die Anmeldung bei Ihrem {0}-Konto abzuschließen.
emailOtpExpiry=Dieser Code läuft in {0} Minuten ab.
emailOtpIgnore=Falls Sie dies nicht beantragt haben, sichern Sie bitte Ihr Konto und kontaktieren Sie uns.
emailOtpBody=Ihr {2}-Bestätigungscode lautet: {0}. Dieser Code läuft in {1} Minuten ab. Falls Sie dies nicht beantragt haben, sichern Sie bitte Ihr Konto und kontaktieren Sie uns.
