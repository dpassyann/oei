# Custom OEI email theme messages (French / default locale).
# Keys consumed by keycloak/themes/oei/email/html/*.ftl. Standard Keycloak/base subjects
# (emailVerificationSubject, passwordResetSubject, executeActionsSubject,
# identityProviderLinkSubject, emailTestSubject) and requiredAction.* labels are already
# localized upstream in the base theme for fr/en/es/de/it/pt and are intentionally left
# inherited (not overridden) here.
#
# Footer copy is reused verbatim from the Spring-side transactional emails
# (backend/infrastructure/mail/src/main/resources/email/messages_fr.properties,
# keys email.shell.nav.*/legal/unsubscribe) so members see one consistent brand voice
# across Keycloak account emails and OEI transactional emails.

emailFooterNavHome=Accueil
emailFooterNavMemberSpace=Espace membre
emailFooterNavContact=Contact
emailFooterLegal=Ordre International des Experts de l''Informatique (OEI) — cet email vous est envoyé dans le cadre de votre relation avec l''OEI.
emailFooterUnsubscribe=Pour gérer vos préférences de communication, contactez-nous.

