parent=keycloak
import=common/keycloak
styles=css/oei.css

# Realm is internationalized across the same 6 languages as the rest of the product
# (see `oei-realm.json`: internationalizationEnabled=true,
# supportedLocales=["fr","en","es","de","it","pt"], defaultLocale="fr"). `locales` below
# is required for Keycloak to load this theme's `messages/messages_{fr,en,es,de,it,pt}.properties`
# (labels for the declarative User Profile's `country` and `consentAccepted` custom attributes
# added to the registration form — see messages/messages_fr.properties and README.md), and
# also enables the built-in Keycloak login-theme language switcher (kc-locale-dropdown) for
# the native login/registration/account-update screens.
locales=fr,en,es,de,it,pt
