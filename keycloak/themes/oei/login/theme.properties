parent=keycloak
import=common/keycloak
styles=css/oei.css

# Realm is mono-locale FR (see `oei-realm.json`: internationalizationEnabled=true,
# supportedLocales=["fr"], defaultLocale="fr") — no language switcher is needed, but
# `locales=fr` is still required for Keycloak to load this theme's `messages/messages_fr.properties`
# (labels for the declarative User Profile's `country` and `consentAccepted` custom attributes
# added to the registration form — see messages/messages_fr.properties and README.md).
locales=fr
