# Custom OEI declarative User Profile labels (registration form) — country dropdown
# and consent checkbox. Auto-derived from ISO 3166-1 CLDR territory names (English)
# via Babel, matching the same 247 country codes as messages_fr.properties (source of
# truth for the code list). See keycloak/themes/oei/login/README.md for how this is wired.

country=Country
consentAccepted=I accept the OEI's terms of use and privacy policy
consentAccepted.accepted=I accept the OEI's terms of use and privacy policy

# login-email-otp.ftl — mandatory email-based MFA step (custom "oei-email-otp-authenticator",
# see keycloak/extensions/email-otp-authenticator). error.ftl page also reuses two keys below.
emailOtpTitle=Verify your identity
emailOtpFormIntro=We have sent a verification code to {0}.
emailOtpCodeLabel=Verification code
emailOtpSubmit=Verify
emailOtpResend=Resend the code
emailOtpResendSuccess=A new code has been sent to your email address.
emailOtpCodeExpired=This code has expired. Request a new one.
emailOtpTooManyAttempts=Too many incorrect attempts. Request a new code.
emailOtpInvalidCode=Incorrect code. Please try again.
emailOtpNoEmailError=We could not send a verification code because your account has no verified email address. Please contact us.
emailOtpSendError=We could not send the verification email. Please try again in a moment.

