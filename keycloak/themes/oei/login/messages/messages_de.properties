# Custom OEI declarative User Profile labels (registration form) — country dropdown
# and consent checkbox. Auto-derived from ISO 3166-1 CLDR territory names (German)
# via Babel, matching the same 247 country codes as messages_fr.properties (source of
# truth for the code list). See keycloak/themes/oei/login/README.md for how this is wired.

country=Land
consentAccepted=Ich akzeptiere die Nutzungsbedingungen und die Datenschutzrichtlinie der OEI
consentAccepted.accepted=Ich akzeptiere die Nutzungsbedingungen und die Datenschutzrichtlinie der OEI

# login-email-otp.ftl — obligatorischer E-Mail-MFA-Schritt ("oei-email-otp-authenticator",
# siehe keycloak/extensions/email-otp-authenticator). error.ftl verwendet auch zwei Schlüssel unten.
emailOtpTitle=Bestätigen Sie Ihre Identität
emailOtpFormIntro=Wir haben einen Bestätigungscode an {0} gesendet.
emailOtpCodeLabel=Bestätigungscode
emailOtpSubmit=Bestätigen
emailOtpResend=Code erneut senden
emailOtpResendSuccess=Ein neuer Code wurde an Ihre E-Mail-Adresse gesendet.
emailOtpCodeExpired=Dieser Code ist abgelaufen. Fordern Sie einen neuen an.
emailOtpTooManyAttempts=Zu viele falsche Versuche. Fordern Sie einen neuen Code an.
emailOtpInvalidCode=Falscher Code. Bitte versuchen Sie es erneut.
emailOtpNoEmailError=Wir konnten keinen Bestätigungscode senden, da Ihr Konto keine verifizierte E-Mail-Adresse hat. Bitte kontaktieren Sie uns.
emailOtpSendError=Wir konnten die Bestätigungs-E-Mail nicht senden. Bitte versuchen Sie es in Kürze erneut.

