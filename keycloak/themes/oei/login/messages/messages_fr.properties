# Custom OEI declarative User Profile labels (registration form) — country dropdown
# and consent checkbox. See keycloak/themes/oei/login/README.md for how this is wired.

country=Pays
consentAccepted=J'accepte les conditions d'utilisation et la politique de confidentialité de l'OEI
consentAccepted.accepted=J'accepte les conditions d'utilisation et la politique de confidentialité de l'OEI

# login-email-otp.ftl — étape MFA obligatoire par email ("oei-email-otp-authenticator",
# voir keycloak/extensions/email-otp-authenticator). error.ftl réutilise aussi deux clés ci-dessous.
emailOtpTitle=Vérifiez votre identité
emailOtpFormIntro=Nous avons envoyé un code de vérification à {0}.
emailOtpCodeLabel=Code de vérification
emailOtpSubmit=Vérifier
emailOtpResend=Renvoyer le code
emailOtpResendSuccess=Un nouveau code a été envoyé à votre adresse email.
emailOtpCodeExpired=Ce code a expiré. Demandez-en un nouveau.
emailOtpTooManyAttempts=Trop de tentatives incorrectes. Demandez un nouveau code.
emailOtpInvalidCode=Code incorrect. Veuillez réessayer.
emailOtpNoEmailError=Nous n'avons pas pu envoyer de code de vérification car votre compte n'a pas d'adresse email vérifiée. Merci de nous contacter.
emailOtpSendError=Nous n'avons pas pu envoyer l'email de vérification. Merci de réessayer dans un instant.

