# Custom OEI declarative User Profile labels (registration form) — country dropdown
# and consent checkbox. Auto-derived from ISO 3166-1 CLDR territory names (Spanish)
# via Babel, matching the same 247 country codes as messages_fr.properties (source of
# truth for the code list). See keycloak/themes/oei/login/README.md for how this is wired.

country=País
consentAccepted=Acepto las condiciones de uso y la política de privacidad de la OEI
consentAccepted.accepted=Acepto las condiciones de uso y la política de privacidad de la OEI

# login-email-otp.ftl — paso MFA obligatorio por email ("oei-email-otp-authenticator",
# ver keycloak/extensions/email-otp-authenticator). error.ftl también reutiliza dos claves.
emailOtpTitle=Verifique su identidad
emailOtpFormIntro=Le hemos enviado un código de verificación a {0}.
emailOtpCodeLabel=Código de verificación
emailOtpSubmit=Verificar
emailOtpResend=Reenviar el código
emailOtpResendSuccess=Se ha enviado un nuevo código a su dirección de correo electrónico.
emailOtpCodeExpired=Este código ha caducado. Solicite uno nuevo.
emailOtpTooManyAttempts=Demasiados intentos incorrectos. Solicite un nuevo código.
emailOtpInvalidCode=Código incorrecto. Vuelva a intentarlo.
emailOtpNoEmailError=No pudimos enviar un código de verificación porque su cuenta no tiene una dirección de correo verificada. Contáctenos.
emailOtpSendError=No pudimos enviar el correo de verificación. Vuelva a intentarlo en un momento.

