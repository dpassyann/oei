name: Deploy Infra (Terraform)

# Manually dispatched only — infrastructure changes are deliberate acts, never
# a side effect of a push. See ../.prompt/deployment/pipeline-github-actions.md
# for the one-time manual bootstrap this depends on (the OIDC role assumed
# below, AWS_DEPLOY_ROLE_ARN, must already exist — it cannot be created by
# this very workflow, chicken-and-egg).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # required for AWS OIDC federation (no long-lived keys)
  contents: read

env:
  TF_WORKING_DIR: .prompt/deployment/terraform
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
  TF_VAR_domain_name: ${{ vars.TF_DOMAIN_NAME || 'theitorder.global' }}
  TF_VAR_route53_zone_id: ${{ vars.TF_ROUTE53_ZONE_ID || '' }}
  TF_VAR_ssh_allowed_cidr: ${{ vars.TF_SSH_ALLOWED_CIDR || '' }}
  TF_VAR_ssh_public_key: ${{ vars.TF_SSH_PUBLIC_KEY || '' }}
  TF_VAR_budget_alert_email: ${{ vars.TF_BUDGET_ALERT_EMAIL || '' }}
  TF_VAR_monthly_budget_amount_usd: ${{ vars.TF_MONTHLY_BUDGET_AMOUNT_USD || '80' }}

jobs:
  terraform:
    name: terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required deployment variables
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}"
          test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}"
          test -n "${TF_VAR_domain_name}"
          test -n "${TF_VAR_ssh_allowed_cidr}"
          test -n "${TF_VAR_ssh_public_key}"
          test -n "${TF_VAR_budget_alert_email}"
          test -n "${TF_VAR_monthly_budget_amount_usd}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: terraform fmt -check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: terraform plan
        if: inputs.action == 'plan'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false

      - name: terraform apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false

      - name: terraform destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -input=false
